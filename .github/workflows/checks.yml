name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install check dependencies and tmux 3.8
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libevent-dev libncurses-dev shellcheck
          python -m pip install ruff
          curl --fail --location --retry 3 https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz -o /tmp/tmux.tar.gz
          tar -xzf /tmp/tmux.tar.gz -C /tmp
          cd /tmp/tmux-3.8
          ./configure
          make -j2
          sudo make install
          tmux -V
      - name: Python static checks
        run: ruff check --select F .
      - name: Shell checks
        run: shellcheck bootstrap.sh install.sh install_web_service.sh
      - name: Python tests
        run: python -m unittest discover -v
      - name: Dashboard tests
        run: node --test tests/web.test.cjs
      - name: tmux interaction tests
        run: |
          python tests/popup_roundtrip.py
          python tests/status_click_roundtrip.py
