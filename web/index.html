<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="tmux attention — multi-host agent status">
  <title>Attention</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@450;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --bg-elevated: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-fg: #f8fafc;
      --wait: #c2410c;
      --review: #0369a1;
      --running: #15803d;
      --idle: #71717a;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-fg: #ffffff;
      --radius: 8px;
      --font: "Outfit", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --max: 42rem;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --header-bg: color-mix(in srgb, var(--bg) 86%, transparent);
      --sheet-bg: #ffffff;
      --scrim: rgb(24 24 27 / 0.42);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0e;
        --bg-elevated: #141417;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --line: #27272a;
        --card: #18181b;
        --accent: #2dd4bf;
        --accent-fg: #042f2e;
        --wait: #fb923c;
        --review: #38bdf8;
        --running: #4ade80;
        --idle: #a1a1aa;
        --danger: #f87171;
        --danger-bg: #450a0a;
        --danger-fg: #2a0707;
        --header-bg: color-mix(in srgb, var(--bg) 88%, transparent);
        --sheet-bg: #18181b;
        --scrim: rgb(0 0 0 / 0.55);
      }
    }
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      font: 15px/1.45 var(--font);
      color: var(--fg);
      background: var(--bg);
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    body.sheet-open { overflow: hidden; }
    .wrap {
      width: min(100%, var(--max));
      margin: 0 auto;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: -4px -8px 0;
      padding: 10px 8px 12px;
      background: var(--header-bg);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--line);
    }
    .refresh-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms var(--ease);
      background: transparent;
    }
    header.is-refreshing .refresh-bar {
      opacity: 1;
    }
    .refresh-bar::after {
      content: "";
      display: block;
      height: 100%;
      width: 36%;
      border-radius: 1px;
      background: color-mix(in srgb, var(--running) 85%, var(--accent));
      animation: refresh-slide 1.05s var(--ease) infinite;
    }
    @keyframes refresh-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .live[data-state="updating"]::before { animation: none; }
      .refresh-bar::after {
        animation: none;
        width: 100%;
        opacity: 0.55;
        transform: none;
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      header {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: var(--card);
      }
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      padding: 5px 9px 5px 8px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--running) 35%, var(--line));
      color: var(--running);
      background: color-mix(in srgb, var(--running) 14%, var(--card));
    }
    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
    }
    .live[data-state="loading"] {
      color: var(--muted);
      border-color: var(--line);
      background: color-mix(in srgb, var(--line) 35%, var(--card));
    }
    .live[data-state="updating"] {
      color: color-mix(in srgb, var(--running) 72%, var(--muted));
      border-color: color-mix(in srgb, var(--running) 28%, var(--line));
      background: color-mix(in srgb, var(--running) 10%, var(--card));
    }
    .live[data-state="updating"]::before {
      animation: live-pulse 1.1s ease-in-out infinite;
    }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent); }
      50% { opacity: 0.45; box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 10%, transparent); }
    }
    .live[data-state="offline"] {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
      background: color-mix(in srgb, var(--danger) 12%, var(--card));
    }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 4%, transparent);
    }
    .stat {
      appearance: none;
      display: block;
      width: 100%;
      margin: 0;
      border: 0;
      background: var(--card);
      padding: 16px 8px 14px;
      text-align: center;
      color: inherit;
      font: inherit;
      cursor: pointer;
      min-height: 4.5rem;
    }
    .stat:disabled {
      opacity: 0.42;
      cursor: default;
    }
    .stat:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      z-index: 1;
      position: relative;
    }
    .stat.active {
      background: color-mix(in srgb, var(--accent) 12%, var(--card));
    }
    .stat .n {
      font-family: var(--mono);
      font-size: clamp(1rem, 5vw, 1.45rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      line-height: 1.15;
      white-space: nowrap;
    }
    .stat .l {
      margin-top: 6px;
      min-height: 1.45em;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .hosts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }
    .host-pill {
      appearance: none;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      cursor: pointer;
      line-height: 1.2;
      color: var(--host-fg, var(--muted));
      background: var(--host-bg, var(--bg-elevated));
      border-color: var(--host-bd, var(--line));
    }
    .host-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .host-pill.all {
      --host-fg: var(--muted);
      --host-bg: var(--bg-elevated);
      --host-bd: var(--line);
      font-weight: 500;
    }
    .host-pill.tone-0 { --host-fg: #0f766e; --host-bg: #ccfbf1; --host-bd: #5eead4; }
    .host-pill.tone-1 { --host-fg: #b45309; --host-bg: #ffedd5; --host-bd: #fdba74; }
    .host-pill.tone-2 { --host-fg: #1d4ed8; --host-bg: #dbeafe; --host-bd: #93c5fd; }
    .host-pill.tone-3 { --host-fg: #be123c; --host-bg: #ffe4e6; --host-bd: #fda4af; }
    .host-pill.tone-4 { --host-fg: #3f6212; --host-bg: #ecfccb; --host-bd: #bef264; }
    .host-pill.tone-5 { --host-fg: #0e7490; --host-bg: #cffafe; --host-bd: #67e8f9; }
    .host-pill.tone-6 { --host-fg: #a16207; --host-bg: #fef9c3; --host-bd: #fde047; }
    .host-pill.tone-7 { --host-fg: #9a3412; --host-bg: #ffedd5; --host-bd: #fb923c; }
    .host-pill.bad {
      opacity: 0.72;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }
    .host-pill.active {
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--host-fg, var(--accent)) 55%, transparent);
      opacity: 1;
    }
    /* Online but idle: mute colors only — avoid filter (breaks flex wrap / overflow). */
    .host-pill.empty:not(.active):not(.bad) {
      --host-fg: var(--muted);
      --host-bg: color-mix(in srgb, var(--line) 42%, var(--card));
      --host-bd: var(--line);
      font-weight: 500;
      box-shadow: none;
      opacity: 0.72;
    }
    .host-pill.empty:not(.active):not(.bad):hover,
    .host-pill.empty:not(.active):not(.bad):focus-visible {
      opacity: 0.92;
      --host-bd: color-mix(in srgb, var(--muted) 35%, var(--line));
    }
    .host-pill.dim {
      opacity: 0.4;
      box-shadow: none;
    }
    .host-pill.dim:hover,
    .host-pill.dim:focus-visible {
      opacity: 0.7;
    }
    .host-pill .count {
      font-weight: 500;
      opacity: 0.88;
      margin-left: 0.15em;
    }
    @media (prefers-color-scheme: dark) {
      .host-pill.tone-0 { --host-fg: #5eead4; --host-bg: #042f2e; --host-bd: #0f766e; }
      .host-pill.tone-1 { --host-fg: #fdba74; --host-bg: #431407; --host-bd: #c2410c; }
      .host-pill.tone-2 { --host-fg: #93c5fd; --host-bg: #172554; --host-bd: #1d4ed8; }
      .host-pill.tone-3 { --host-fg: #fda4af; --host-bg: #4c0519; --host-bd: #be123c; }
      .host-pill.tone-4 { --host-fg: #bef264; --host-bg: #1a2e05; --host-bd: #4d7c0f; }
      .host-pill.tone-5 { --host-fg: #67e8f9; --host-bg: #083344; --host-bd: #0e7490; }
      .host-pill.tone-6 { --host-fg: #fde047; --host-bg: #422006; --host-bd: #a16207; }
      .host-pill.tone-7 { --host-fg: #fb923c; --host-bg: #431407; --host-bd: #c2410c; }
    }
    main.list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding-bottom: 8px;
    }
    .section {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 12px 0 2px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      scroll-margin-top: 7.5rem;
    }
    .section:first-child { margin-top: 4px; }
    .section .count {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.72rem;
      opacity: 0.9;
    }
    .section[data-group="review"] {
      color: var(--review);
    }
    .section[data-group="review"] .count {
      padding: 1px 6px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--review) 16%, transparent);
      opacity: 1;
    }
    .review-state { display: inline-flex; align-items: center; gap: 4px; font-size: 0.68rem; font-weight: 500; color: var(--muted); }
    .review-state.unread { color: var(--review); font-weight: 600; }
    .review-state.unread::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .card {
      position: relative;
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px 12px 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--idle);
      transition: border-color 160ms var(--ease), background 160ms var(--ease);
      cursor: pointer;
    }
    .card.shell { cursor: default; }
    /* The whole card is one button; the trash sits above it so the two never nest. */
    .card-open {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: inherit;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .card-open:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
    @media (prefers-reduced-motion: no-preference) {
      .card { transition: border-color 160ms var(--ease), background 160ms var(--ease), transform 140ms var(--ease); }
      .card:active { transform: scale(0.985); }
    }
    .card.selected {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 6%, var(--card));
    }
    .card.wait { border-left-color: var(--wait); }
    .card.review.unread {
      border-left-color: var(--review);
      background: color-mix(in srgb, var(--review) 7%, var(--card));
    }
    .card.review.unread.newest {
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--review) 40%, transparent);
      background: color-mix(in srgb, var(--review) 11%, var(--card));
    }
    .card.running { border-left-color: var(--running); }
    .card.idle { border-left-color: var(--idle); }
    .card.shell {
      border-left-color: color-mix(in srgb, var(--muted) 40%, var(--line));
      background: color-mix(in srgb, var(--card) 70%, var(--bg));
    }
    .card.error {
      border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
      border-left-color: var(--danger);
      background: var(--danger-bg);
    }
    .row1 {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      justify-content: space-between;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      font-weight: 600;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      min-width: 0;
    }
    .emoji { font-size: 1.05rem; line-height: 1; }
    .project { min-width: 0; overflow-wrap: anywhere; }
    .cli {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--bg);
      flex: 0 0 auto;
    }
    .cli img { width: 16px; height: 16px; display: block; }
    @media (prefers-color-scheme: dark) {
      .cli.agent img { filter: invert(1); }
    }
    .cli.broken::after {
      content: attr(title);
      font-family: var(--mono);
      font-size: 0.55rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--muted);
      max-width: 26px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
    }
    .age {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
      padding-top: 3px;
    }
    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .env {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      min-width: 0;
    }
    .env .repo { color: color-mix(in srgb, var(--fg) 72%, var(--muted)); }
    .env .branch { color: var(--muted); overflow-wrap: anywhere; }
    .env .dirty {
      color: var(--wait);
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sheet-env {
      margin: 0 0 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.45;
      color: var(--muted);
    }
    .sheet-env .path {
      color: color-mix(in srgb, var(--fg) 78%, var(--muted));
      overflow-wrap: anywhere;
    }
    .sheet-env .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-top: 4px;
      align-items: baseline;
    }
    .sheet-env .branch { color: var(--muted); }
    .sheet-env .dirty { color: var(--wait); }
    .reason {
      margin-top: 7px;
      font-size: 0.88rem;
      color: color-mix(in srgb, var(--fg) 82%, var(--muted));
      text-wrap: pretty;
    }
    .card.error .reason { color: var(--danger); font-weight: 500; }
    .preview {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .preview-line {
      display: grid;
      grid-template-columns: 2.4rem minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      font-size: 0.84rem;
      line-height: 1.4;
    }
    .preview-line .who {
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--muted);
      padding-top: 3px;
    }
    .preview-line.user .text {
      color: var(--fg);
      font-weight: 500;
      text-wrap: pretty;
    }
    .preview-line.user:last-of-type .text { font-weight: 600; }
    .preview-line.agent {
      margin-top: 3px;
      padding-top: 6px;
      border-top: 1px dashed var(--line);
    }
    .preview-line.agent .text {
      color: var(--muted);
      text-wrap: pretty;
    }
    /* Card previews: result first, the latest prompt as muted context, cut on whole lines. */
    .card .preview-line { grid-template-columns: minmax(0, 1fr); }
    .card .preview-line .who {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .card .preview-line.agent { margin-top: 0; padding-top: 0; border-top: 0; }
    .card .preview-line .text.md {
      max-height: calc(1.45em * 5);
      overflow: hidden;
    }
    .card .preview-line .text.md > * { margin: 0; }
    .card .preview-line .text.md.clipped {
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 1.45em), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 1.45em), transparent);
    }
    .card.review.unread .preview-line.agent .text,
    .card.wait .preview-line.agent .text { color: var(--fg); }
    .card .preview-line.user {
      position: relative;
      padding-left: 0.95rem;
      font-size: 0.8rem;
    }
    .card .preview-line.user::before {
      content: '›';
      position: absolute;
      left: 0.1rem;
      color: var(--muted);
      font-weight: 600;
    }
    .card .preview-line.user .text.md {
      max-height: calc(1.45em * 2);
      color: var(--muted);
      font-weight: 400;
    }
    .sheet-preview .preview-line .text {
      overflow-wrap: anywhere;
    }
    .sheet-preview .preview-line .text.md {
      max-height: none;
      overflow: visible;
    }
    .preview-line .text.md {
      font-size: inherit;
      line-height: 1.45;
    }
    .preview-line .text.md > :first-child { margin-top: 0; }
    .preview-line .text.md > :last-child { margin-bottom: 0; }
    .preview-line .text.md p,
    .preview-line .text.md ul,
    .preview-line .text.md ol,
    .preview-line .text.md pre,
    .preview-line .text.md blockquote,
    .preview-line .text.md table {
      margin: 0.35em 0;
    }
    .preview-line .text.md h1,
    .preview-line .text.md h2,
    .preview-line .text.md h3,
    .preview-line .text.md h4 {
      margin: 0.55em 0 0.25em;
      font-size: 1em;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1.3;
    }
    .preview-line .text.md h1 { font-size: 1.12em; }
    .preview-line .text.md h2 { font-size: 1.06em; }
    .preview-line .text.md ul,

    <section class="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <header class="reader-top">
        <button type="button" class="icon-btn" id="reader-back" aria-label="返回" title="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="reader-heading">
          <h2 id="reader-title">訊息</h2>
          <div class="reader-sub" id="reader-sub"></div>
        </div>
        <button type="button" class="icon-btn" id="reader-copy" aria-label="複製全文" title="複製全文" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        </button>
      </header>
      <div class="reader-body" id="reader-body" tabindex="0"></div>
      <span class="reader-status" id="reader-status" aria-live="polite"></span>
      <button type="button" class="reader-reply" id="reader-reply">回覆</button>
    </section>
  </div>

  <script>
    const SECTIONS = [
      ['wait', '等待回覆'],
      ['review', '待看'],
      ['idle', '閒置'],
      ['running', '進行中'],
      ['shell', '其他 pane'],
    ];
    const SECTION_EMOJI = { wait: '🙋', review: '👀', running: '🏃', idle: '💤', shell: '💻' };
    // Reasons that only repeat what the emoji, badge and section title already say.
    const GENERIC_REASONS = new Set(['已完成，尚未查看', '已完成，已查看', '閒置，等待新任務', '正在工作']);
    let selectedKey = '';
    let latestAgents = [];
    let latestHosts = [];
    let latestPayload = null;
    let hostFilters = new Set(); // empty = show all hosts
    let activeGroup = '';
    let sheetOpen = false;
    let sheetPreviewKey = '';
    let sheetPreviewFull = false;
    let sheetPreviewUpdated = 0;
    let sheetPreviewRevision = 0;
    let sheetPreviewToken = 0;
    const acknowledgedVersions = new Map();
    const acknowledgementsInFlight = new Map();
    const PEER_OUTDATED = 'peer is running an older tmux-attn without this feature';
    const READER_PREFIX = '#/m/';
    const READER_SIG_CHARS = 200;
    let sheetPreviewData = { users: [], agent: '' };
    let readerOpen = false;
    let readerHash = '';
    let readerPushed = false;
    let readerToken = 0;
    let readerText = '';
    let routeSettled = false;
    const readerSigs = new Map();
    const READER_SIG_STORE = 'attn.readerSigs';
    const MAX_IMAGES = 4;
    const MAX_IMAGE_EDGE = 2048;
    const MAX_IMAGE_BYTES = 8 * 1024 * 1024;
    const UPLOADING_NOTICE = '圖片上傳中，請稍候再送出';
    let attachments = []; // { key, name, previewUrl, status: 'uploading' | 'ready' | 'error', imageId, error }
    let attachmentSeq = 0;
    const STALE_HOST_TTL_MS = 35000;
    const lastGoodByHost = new Map();

    function agentKey(a) {
      return [a.host || '', a.pane || '', a.pid || ''].join('|');
    }
    function agentName(a) {
      return a.project || a.window || '未命名專案';
    }
    function hostTone(name) {
      const text = String(name || '');
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return Math.abs(hash) % 8;
    }
    function agentHostName(a) {
      return a.host || latestHosts.find(h => h.source === 'local')?.name || 'local';
    }
    function visibleAgents() {
      if (!hostFilters.size) return latestAgents;
      return latestAgents.filter(a => hostFilters.has(agentHostName(a)));
    }
    function hostSessionCounts(agents) {
      // Count tracked agent sessions only — bare shell panes are not sessions.
      const counts = Object.create(null);
      for (const a of agents) {
        if (category(a) === 'shell') continue;
        const name = agentHostName(a);
        counts[name] = (counts[name] || 0) + 1;
      }
      return counts;
    }
    function sortedHosts(hosts, sessionCounts) {
      return [...hosts].sort((a, b) => {
        const countDiff = (sessionCounts[b.name] || 0) - (sessionCounts[a.name] || 0);
        if (countDiff) return countDiff;
        if (!!a.ok !== !!b.ok) return a.ok ? -1 : 1;
        return String(a.name || '').localeCompare(String(b.name || ''), 'en');
      });
    }
    function category(agent) {
      if (agent.tracked === false || agent.state === 'SHELL') return 'shell';
      // The server owns classification; a just-confirmed version moves immediately.
      if (['wait', 'review', 'running', 'idle'].includes(agent.category)) {
        return agent.category === 'review' && !isUnread(agent) ? 'idle' : agent.category;
      }
      // Compatibility with older peers that do not publish a category yet.
      if (agent.state === 'WAIT') return 'wait';
      if (agent.state === 'RUNNING') return 'running';
      return isUnread(agent) ? 'review' : 'idle';
    }
    function isUnread(agent) {
      const reviewable = agent.state === 'WAIT' || (agent.needs_review ?? agent.unread ?? agent.pending ?? false);
      if (!reviewable) return false;
      const acknowledged = Math.max(Number(agent.acknowledged) || 0, acknowledgedVersions.get(agentKey(agent)) || 0);
      if (Number.isInteger(agent.revision) && agent.revision > 0) return agent.revision > acknowledged;
      return agent.unread ?? agent.pending ?? !agent.reviewed;
    }
    const CLI_ICONS = { claude: 'claude', codex: 'codex', agent: 'agent', cursor: 'agent', pi: 'pi' };
    function cliBadge(cli) {
      const name = String(cli || '').toLowerCase();
      if (!Object.hasOwn(CLI_ICONS, name)) return '';
      const icon = escapeHtml(CLI_ICONS[name]);
      return `<span class="cli ${icon}" title="${escapeHtml(name)}"><img src="/icons/${icon}.svg" alt="${escapeHtml(name)}" loading="lazy" onerror="this.closest('.cli').classList.add('broken');this.remove()"></span>`;
    }
    function renderMarkdown(text) {
      const raw = String(text ?? '');
      if (!raw) return '';
      try {
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
          if (!renderMarkdown._ready) {
            marked.setOptions({ gfm: true, breaks: true });
            renderMarkdown._ready = true;
          }
          const html = marked.parse(raw, { async: false });
          return DOMPurify.sanitize(html, {
            USE_PROFILES: { html: true },
            ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto):|[^a-z]|[a-z+.-]+(?:[^a-z+.-:]|$))/i,
          });
        }
      } catch (_) { /* fall through */ }
      return escapeHtml(raw).replace(/\n/g, '<br>');
    }
    function previewLineHtml(role, text, attrs = '', hint = '') {
      const label = role === 'user' ? 'you' : 'agent';
      return `<div class="preview-line ${role}"${attrs}><span class="who">${label}</span><span class="text md">${renderMarkdown(text)}</span>${hint}</div>`;
    }
    function previewHtml(preview, { actionable = false } = {}) {
      const users = Array.isArray(preview?.users) ? preview.users.filter(Boolean) : [];
      const agentLine = preview?.agent || '';
      if (!users.length && !agentLine) return '';
      const target = (role, index) => actionable ? ` data-role="${role}" data-index="${index}"` : '';
      const openFull = actionable ? '<button type="button" class="open-full">全文</button>' : '';
      return `<div class="preview">${
        users.map((text, i) => previewLineHtml('user', text, target('user', i), openFull)).join('')
      }${agentLine ? previewLineHtml('agent', agentLine, target('agent', 0), openFull) : ''}</div>`;
    }
    // A card is a glance: the result you came for first, then only the latest prompt for context.
    function cardPreviewHtml(preview) {
      const users = Array.isArray(preview?.users) ? preview.users.filter(Boolean) : [];
      const lastUser = users[users.length - 1] || '';
      const agentLine = preview?.agent || '';
      if (!lastUser && !agentLine) return '';
      return `<div class="preview">${agentLine ? previewLineHtml('agent', agentLine) : ''}${lastUser ? previewLineHtml('user', lastUser) : ''}</div>`;
    }
    function markClippedPreviews() {
      document.querySelectorAll('.card .preview-line .text.md').forEach(el => {
        el.classList.toggle('clipped', el.scrollHeight > el.clientHeight + 1);
      });
    }
    function clipBranch(branch, limit = 36) {
      const text = String(branch || '');
      if (text.length <= limit) return text;
      return text.slice(0, Math.max(0, limit - 1)) + '…';
    }
    function envLineHtml(a) {
      const project = a.project || '';
      const repo = a.repo || '';
      const showRepo = repo && repo !== project;
      const branch = clipBranch(a.branch || '');
      const parts = [];
      if (showRepo) parts.push(`<span class="repo">${escapeHtml(repo)}</span>`);
      if (branch) parts.push(`<span class="branch">${escapeHtml(branch)}</span>`);
      if (a.dirty) parts.push('<span class="dirty">dirty</span>');
      return parts.length ? `<div class="env">${parts.join('')}</div>` : '';
    }
    function sheetEnvHtml(a) {
      const path = a.path || '';
      const branch = a.branch || '';
      if (!path && !branch) return '';
      const bits = [];
      if (branch) bits.push(`<span class="branch">${escapeHtml(branch)}</span>`);
      if (a.dirty) bits.push('<span class="dirty">dirty</span>');
      return `<div class="path">${escapeHtml(path || (a.repo || ''))}</div>` +
        (bits.length ? `<div class="row">${bits.join('')}</div>` : '');
    }
    function attentionDisplay(a) {
      const cat = category(a);
      const reviewed = cat === 'idle' && (a.needs_review || a.reviewed) && !isUnread(a);
      const emoji = SECTION_EMOJI[cat];
      const reason = reviewed ? String(a.reason || '').replace('尚未查看', '已查看') : a.reason;
      return { cat, reviewed, emoji, reason };
    }
    function cardHtml(a, opts = {}) {
      const { cat, reviewed, emoji, reason } = attentionDisplay(a);
      const errorClass = a.severity === 'error' ? ' error' : '';
      const newestClass = opts.newest ? ' newest' : '';
      const reviewClass = cat === 'review' ? ' unread' : '';
      const reviewState = cat === 'review' ? '<span class="review-state unread">未看</span>' :
        reviewed ? '<span class="review-state">已看</span>' : '';
      const selected = agentKey(a) === selectedKey ? ' selected' : '';
      const key = agentKey(a);
      const name = agentName(a);
      const killClass = a.tracked && killPhase(key) ? ' kill-armed' : '';
      const killNote = killState.key === key && killState.note
        ? `<div class="kill-note">${escapeHtml(killState.note)}</div>` : '';
      return `<article class="card ${cat}${reviewClass}${newestClass}${errorClass}${selected}${killClass}" data-key="${escapeHtml(key)}">
        ${a.tracked ? `<button type="button" class="card-open" aria-label="開啟 ${escapeHtml(name)}"></button>` : ''}
        <div class="row1">
          <div class="title">
            <span class="emoji" aria-hidden="true">${emoji}</span>
            ${cliBadge(a.cli || a.agent)}
            <span class="project">${escapeHtml(name)}</span>
            ${reviewState}
          </div>
          <div class="row1-side">
            <div class="age">${escapeHtml(a.age)}</div>
            ${a.tracked ? killButtonHtml(key, name) : ''}
          </div>
        </div>
        ${killNote}
        ${envLineHtml(a)}
        ${GENERIC_REASONS.has(reason) ? '' : `<div class="reason">${escapeHtml(reason)}</div>`}
        ${cardPreviewHtml(a.preview)}
      </article>`;
    }
    // Closing a pane is destructive, so a card's trash needs two taps. The state lives here rather than in the
    // DOM because the poll re-renders every card.
    const KILL_ARM_MS = 5000;
    const KILL_NOTE_MS = 6000;
    const KILL_BUSY_MAX_MS = 35000; // outlasts the server's 30s handler timeout
    const KILL_IDLE = { key: '', until: 0, busy: false, note: '' };
    const TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
    let killState = KILL_IDLE;
    function killPhase(key) {
      if (killState.key !== key) return '';
      if (killState.busy) return 'busy';
      return Date.now() < killState.until ? 'armed' : '';
    }
    function replaceCard(key) {
      const selector = `.card[data-key="${CSS.escape(key)}"]`;
      const el = document.querySelector(selector);
      const agent = latestAgents.find(a => agentKey(a) === key);
      if (!el || !agent) return;
      // Swapping the markup drops focus, so hand it back to the control the user was on.
      const active = document.activeElement;
      const refocus = active && el.contains(active) ? (active.closest('[data-kill]') ? '[data-kill]' : '.card-open') : '';
      el.outerHTML = cardHtml(agent, { newest: el.classList.contains('newest') });
      const target = refocus && (document.querySelector(selector) || { querySelector: () => null }).querySelector(refocus);
      if (target) target.focus();
      markClippedPreviews();
    }
    function announceKill(text) {
      document.getElementById('kill-live').textContent = text;
    }
    function setKillState(next, ttl = 0) {
      const touched = new Set([killState.key, next.key]);
      killState = next;
      // A timer only resets the state it was started for, so a newer arm is never cut short by an older timer.
      if (ttl) setTimeout(() => { if (killState === next) setKillState(KILL_IDLE); }, ttl);
      for (const key of touched) if (key) replaceCard(key);
    }
    function killButtonHtml(key, name) {
      const phase = killPhase(key);
      const label = { armed: '確認關閉', busy: '關閉中…' }[phase] || '';
      const aria = phase === 'armed' ? `再按一次確認關閉 ${name}` : `關閉 ${name}`;
      const tip = phase === 'armed' ? `${KILL_ARM_MS / 1000} 秒內再按一次確認關閉` : '關閉 pane（需按兩次）';
      // aria-disabled, not disabled: a disabled button would drop keyboard focus mid-close.
      return `<button type="button" class="card-kill${phase ? ' ' + phase : ''}" data-kill aria-label="${escapeHtml(aria)}" title="${tip}"${phase === 'busy' ? ' aria-disabled="true"' : ''}>${TRASH_SVG}${label ? `<span class="card-kill-label">${label}</span>` : ''}</button>`;
    }
    async function onCardKill(key) {
      const agent = latestAgents.find(a => agentKey(a) === key && a.tracked);
      if (!agent || killState.busy) return;
      if (killPhase(key) !== 'armed') {
        setKillState({ key, until: Date.now() + KILL_ARM_MS, busy: false, note: '' }, KILL_ARM_MS);
        announceKill(`再按一次確認關閉 ${agentName(agent)}`);
        return;
      }
      const busy = { key, until: 0, busy: true, note: '' };
      setKillState(busy, KILL_BUSY_MAX_MS);
      try {
        const res = await fetch('/api/kill', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        // Stay on "closing" until a render no longer lists the pane; a poll already in flight may still show it.
        refresh();
      } catch (e) {
        if (killState !== busy && killState !== KILL_IDLE) return;
        setKillState({ key, until: 0, busy: false, note: e.message }, KILL_NOTE_MS);
        announceKill(`關閉失敗：${e.message}`);
      }
    }
    function closeSheet() {
      closeReader();
      clearAttachments();
      sheetOpen = false;
      selectedKey = '';
      sheetPreviewKey = '';
      sheetPreviewFull = false;
      sheetPreviewUpdated = 0;
      sheetPreviewRevision = 0;
      sheetPreviewData = { users: [], agent: '' };
      sheetPreviewToken += 1;
      document.getElementById('sheet-root').hidden = true;
      document.body.classList.remove('sheet-open');
      document.getElementById('sheet-text').value = '';
      document.getElementById('sheet-status').textContent = '';
      document.getElementById('sheet-status').className = 'sheet-feedback';
      document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
      if (latestPayload) render(latestPayload);
    }
    function setSheetStatus(message, kind = '') {
      const status = document.getElementById('sheet-status');
      status.className = kind ? `sheet-feedback ${kind}` : 'sheet-feedback';
      status.textContent = message;
    }
    async function prepareImage(file) {
      // Downscale and re-encode: keeps uploads small on mobile data and drops EXIF (incl. GPS).
      const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const ctx = canvas.getContext('2d');
      const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      if (type === 'image/jpeg') {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      if (bitmap.close) bitmap.close();
      const blob = await new Promise(resolve => canvas.toBlob(resolve, type, 0.85));
      if (!blob) throw new Error('無法處理這張圖片');
      return blob;
    }
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = () => reject(new Error('讀取圖片失敗'));
        reader.readAsDataURL(blob);
      });
    }
    function attachmentHtml(item) {
      const label = item.status === 'error' ? `${item.name}：${item.error || '上傳失敗'}` : item.name;
      return `<div class="attachment ${item.status}" data-key="${escapeHtml(item.key)}">
        <img src="${escapeHtml(item.previewUrl)}" alt="${escapeHtml(label)}">
        <button type="button" class="attachment-remove" data-remove aria-label="移除 ${escapeHtml(item.name)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>`;
    }
    function renderAttachments() {
      const box = document.getElementById('sheet-attachments');
      box.hidden = attachments.length === 0;
      box.innerHTML = attachments.map(attachmentHtml).join('');
      document.getElementById('sheet-attach').disabled = attachments.length >= MAX_IMAGES;
    }
    function patchAttachment(key, patch) {
      if (!attachments.some(item => item.key === key)) return false;
      attachments = attachments.map(item => item.key === key ? { ...item, ...patch } : item);
      renderAttachments();
      return true;
    }
    function clearAttachments() {
      attachments.forEach(item => URL.revokeObjectURL(item.previewUrl));
      attachments = [];
      renderAttachments();
    }
    function removeAttachment(key) {
      const item = attachments.find(row => row.key === key);
      if (!item) return;
      URL.revokeObjectURL(item.previewUrl);
      attachments = attachments.filter(row => row.key !== key);
      renderAttachments();
    }
    async function uploadAttachment(agent, key, file) {
      const sheetKey = agentKey(agent);
      const stillWanted = () => sheetOpen && selectedKey === sheetKey && attachments.some(item => item.key === key);
      try {
        const blob = await prepareImage(file);
        if (!stillWanted()) return;
        if (blob.size > MAX_IMAGE_BYTES) throw new Error('圖片太大（上限 8MB）');
        const data = await blobToBase64(blob);
        if (!stillWanted()) return;
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid, data }),
        });
        const body = await res.json();
        if (!res.ok || !body.ok) throw new Error(body.error || `HTTP ${res.status}`);
        if (stillWanted()) patchAttachment(key, { status: 'ready', imageId: body.id });
      } catch (e) {
        if (stillWanted()) patchAttachment(key, { status: 'error', error: friendlyError((e && e.message) || '上傳失敗') });
      }
      const status = document.getElementById('sheet-status');
      if (status.textContent === UPLOADING_NOTICE && !attachments.some(item => item.status === 'uploading')) setSheetStatus('');
    }
    function addImages(fileList) {
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      if (!sheetOpen || !agent) return;
      const files = Array.from(fileList || []);
      const images = files.filter(file => String(file.type).startsWith('image/'));
      const room = Math.max(0, MAX_IMAGES - attachments.length);
      const accepted = images.slice(0, room);
      if (images.length < files.length) setSheetStatus('只支援圖片檔', 'bad');
      else if (accepted.length < images.length) setSheetStatus(`最多 ${MAX_IMAGES} 張圖片`, 'bad');
      else if (accepted.length) setSheetStatus('');
      const added = accepted.map(file => ({
        key: `img-${++attachmentSeq}`, name: file.name || 'image',
        previewUrl: URL.createObjectURL(file), status: 'uploading', imageId: '', error: '',
      }));
      if (!added.length) return;
      attachments = attachments.concat(added);
      renderAttachments();
      added.forEach((item, index) => uploadAttachment(agent, item.key, accepted[index]));
    }
    function readerHashFor(agent, role, index) {
      return READER_PREFIX + [agent.host || '', agent.pane, agent.pid, role, index]
        .map(part => encodeURIComponent(String(part))).join('/');
    }
    function parseReaderHash(hash) {
      if (!String(hash).startsWith(READER_PREFIX)) return null;
      const parts = hash.slice(READER_PREFIX.length).split('/');
      if (parts.length !== 5 || !/^\d+$/.test(parts[4])) return null;
      let host, pane, pid, role;
      try {
        [host, pane, pid, role] = parts.slice(0, 4).map(decodeURIComponent);
      } catch (_) {
        return null;
      }
      if ((role !== 'user' && role !== 'agent') || !pane || !pid) return null;
      return { host, pane, pid, role, index: Number(parts[4]) };
    }
    function storedReaderSigs() {
      try {
        return JSON.parse(sessionStorage.getItem(READER_SIG_STORE) || '{}');
      } catch (_) {
        return {};
      }
    }
    function rememberReaderSig(hash, sig) {
      readerSigs.set(hash, sig);
      try {
        sessionStorage.setItem(READER_SIG_STORE, JSON.stringify({ ...storedReaderSigs(), [hash]: sig }));
      } catch (_) { /* a reload then loses the staleness check; the reader still works */ }
    }
    function recallReaderSig(hash) {
      return readerSigs.get(hash) || storedReaderSigs()[hash] || '';
    }
    function clearRoute() {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
    function hideReader() {
      readerOpen = false;
      readerHash = '';
      readerPushed = false;
      readerText = '';
      readerToken += 1;
      document.getElementById('reader-root').hidden = true;
      document.body.classList.remove('reader-open');
      document.getElementById('reader-body').innerHTML = '';
      document.getElementById('reader-status').textContent = '';
    }
    function closeReader() {
      if (!readerOpen) return;
      if (readerPushed) {
        window.history.back();
      } else {
        clearRoute();
      }
      hideReader();
    }
    function friendlyError(error) {
      return error === PEER_OUTDATED
        ? '這台主機的 tmux-attn 版本較舊，尚不支援此功能。請在那台主機更新並重啟 web 服務。' : error;
    }
    function readerErrorHtml(error, role) {

      const bar = document.getElementById('refresh-bar');
      const clock = document.getElementById('clock');
      if (header) header.classList.toggle('is-refreshing', on);
      if (bar) {
        bar.hidden = !on;
        bar.setAttribute('aria-hidden', on ? 'false' : 'true');
      }
      if (on && clock.dataset.state !== 'offline') {
        clock.textContent = 'live';
        clock.dataset.state = 'updating';
      }
    }

    async function refresh() {
      if (refreshInFlight) return;
      refreshInFlight = true;
      const clock = document.getElementById('clock');
      const cold = !hasLoaded;
      const started = performance.now();
      if (cold) setColdSkeleton(true);
      else setRefreshing(true);
      try {
        const res = await fetch('/api/fleet', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'payload error');
        render(data);
        hasLoaded = true;
        document.getElementById('error').hidden = true;
        if (cold) {
          setColdSkeleton(false);
        } else {
          const elapsed = performance.now() - started;
          if (elapsed < REFRESH_HINT_MIN_MS) {
            await new Promise(r => setTimeout(r, REFRESH_HINT_MIN_MS - elapsed));
          }
          setRefreshing(false);
        }
        clock.textContent = 'live';
        clock.dataset.state = 'live';
      } catch (e) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = '無法讀取狀態：' + e.message;
        if (cold) {
          // Stay on skeleton until first success.
        } else {
          setRefreshing(false);
        }
        clock.textContent = 'offline';
        clock.dataset.state = 'offline';
      } finally {
        refreshInFlight = false;
      }
    }
    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
