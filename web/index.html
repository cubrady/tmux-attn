<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="tmux attention — multi-host agent status">
  <title>Attention</title>
  <link id="favicon" rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/favicon.svg">
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
  <script id="early-fleet-request">
    // Start the host roster before font and Markdown resources block page scripts.
    window.initialFleetPlanRequest = fetch('/api/fleet/plan', { cache: 'no-store' })
      .then(res => ({ res }), error => ({ error }));
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@450;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <style>
    :root {
      --font-scale: 1;
      --bg: #f4f5f7;
      --bg-elevated: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-fg: #f8fafc;
      --wait: #c2410c;
      --review: #0369a1;
      --running: #15803d;
      --idle: #71717a;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-fg: #ffffff;
      --radius: 8px;
      --font: "Outfit", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --max: 42rem;
      --sheet-max: 44rem;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --header-bg: color-mix(in srgb, var(--bg) 86%, transparent);
      --sheet-bg: #ffffff;
      --scrim: rgb(24 24 27 / 0.42);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0e;
        --bg-elevated: #141417;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --line: #27272a;
        --card: #18181b;
        --accent: #2dd4bf;
        --accent-fg: #042f2e;
        --wait: #fb923c;
        --review: #38bdf8;
        --running: #4ade80;
        --idle: #a1a1aa;
        --danger: #f87171;
        --danger-bg: #450a0a;
        --danger-fg: #2a0707;
        --header-bg: color-mix(in srgb, var(--bg) 88%, transparent);
        --sheet-bg: #18181b;
        --scrim: rgb(0 0 0 / 0.55);
      }
    }
    * { box-sizing: border-box; }
    html {
      color-scheme: light dark;
      font-size: calc(16px * var(--font-scale, 1));
    }
    body {
      margin: 0;
      min-height: 100dvh;
      font: 0.9375rem/1.45 var(--font);
      color: var(--fg);
      background: var(--bg);
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    body.sheet-open { overflow: hidden; }
    .wrap {
      width: min(100%, var(--max));
      margin: 0 auto;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: -4px -8px 0;
      padding: 8px 8px 10px;
      background: var(--header-bg);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--line);
    }
    .refresh-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms var(--ease);
      background: transparent;
    }
    header.is-refreshing .refresh-bar {
      opacity: 1;
    }
    .refresh-bar::after {
      content: "";
      display: block;
      height: 100%;
      width: 36%;
      border-radius: 1px;
      background: color-mix(in srgb, var(--running) 85%, var(--accent));
      animation: refresh-slide 1.05s var(--ease) infinite;
    }
    @keyframes refresh-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .live[data-state="updating"]::before { animation: none; }
      .refresh-bar::after {
        animation: none;
        width: 100%;
        opacity: 0.55;
        transform: none;
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      header {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: var(--card);
      }
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }
    .brand-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-shrink: 1;
      min-width: 0;
    }
    .notify-btn {
      appearance: none;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font: 600 0.72rem/1 var(--font);
      color: var(--muted);
      background: color-mix(in srgb, var(--line) 35%, var(--card));
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      cursor: pointer;
      white-space: nowrap;
      min-width: 0;
      max-width: 100%;
      transition: color 140ms var(--ease), border-color 140ms var(--ease), background 140ms var(--ease);
    }
    #notify-label {
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .notify-btn[hidden] { display: none; }
    .notify-btn:hover {
      color: var(--fg);
      border-color: color-mix(in srgb, var(--fg) 22%, var(--line));
    }
    .notify-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .notify-btn[data-state="on"] {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
      background: color-mix(in srgb, var(--accent) 12%, var(--card));
    }
    .notify-btn[data-state="denied"] {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
      background: color-mix(in srgb, var(--danger) 10%, var(--card));
    }
    .notify-icon {
      display: inline-flex;
      align-items: center;
    }
    .notify-icon svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }
    .notify-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--wait);
      box-shadow: 0 0 0 2px var(--bg);
    }
    .notify-dot[hidden] { display: none; }
    .font-size-ctrl {
      display: inline-flex;
      align-items: center;
      background: color-mix(in srgb, var(--line) 35%, var(--card));
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px;
      gap: 1px;
    }
    .font-btn {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: 600 0.8rem/1 var(--font);
      cursor: pointer;
      transition: color 140ms var(--ease), background 140ms var(--ease);
      user-select: none;
      -webkit-user-select: none;
    }
    @media (hover: hover) {
      .font-btn:hover:not(:disabled) {
        color: var(--fg);
        background: color-mix(in srgb, var(--fg) 10%, transparent);
      }
    }
    .font-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .font-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .font-reset {
      font-size: 0.72rem;
      font-weight: 700;
      min-width: 20px;
    }
    .font-reset.is-scaled {
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: none;
      line-height: 1;
      padding: 5px 9px 5px 8px;
      max-width: 9.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--running) 35%, var(--line));
      color: var(--running);
      background: color-mix(in srgb, var(--running) 14%, var(--card));
    }
    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
    }
    .live[data-state="loading"] {
      color: var(--muted);
      border-color: var(--line);
      background: color-mix(in srgb, var(--line) 35%, var(--card));
    }
    .live[data-state="updating"] {
      color: color-mix(in srgb, var(--running) 72%, var(--muted));
      border-color: color-mix(in srgb, var(--running) 28%, var(--line));
      background: color-mix(in srgb, var(--running) 10%, var(--card));
    }
    .live[data-state="updating"]::before {
      animation: live-pulse 1.1s ease-in-out infinite;
    }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent); }
      50% { opacity: 0.45; box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 10%, transparent); }
    }
    .live[data-state="offline"] {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
      background: color-mix(in srgb, var(--danger) 12%, var(--card));
    }
    .meta {
      color: var(--muted);
      font-size: 0.74rem;
      font-variant-numeric: tabular-nums;
      margin-bottom: 8px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .stat {
      appearance: none;
      display: block;
      width: 100%;
      margin: 0;
      border: 0;
      background: var(--card);
      padding: 10px 8px 9px;
      text-align: center;
      color: inherit;
      font: inherit;
      cursor: pointer;
      min-height: 3.35rem;
    }
    .stat:disabled {
      opacity: 0.42;
      cursor: default;
    }
    .stat:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      z-index: 1;
      position: relative;
    }
    .stat.active {
      background: color-mix(in srgb, var(--accent) 12%, var(--card));
    }
    .stat .n {
      font-family: var(--mono);
      font-size: clamp(0.98rem, 4.2vw, 1.25rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      line-height: 1.1;
      white-space: nowrap;
    }
    .stat .l {
      margin-top: 3px;
      min-height: 1.25em;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .summary-later {
      grid-column: 1 / -1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 2px 10px;
      border: 0;
      background: var(--card);
      color: var(--muted);
      font: 600 0.68rem var(--font);
      cursor: pointer;
    }
    .summary-later:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 6%, var(--card)); }
    .summary-later:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .summary-later .count { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .hosts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      align-items: center;
    }
    .host-pill {
      appearance: none;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      cursor: pointer;
      line-height: 1.2;
      color: var(--host-fg, var(--muted));
      background: var(--host-bg, var(--bg-elevated));
      border-color: var(--host-bd, var(--line));
    }
    .host-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .host-pill.all {
      --host-fg: var(--muted);
      --host-bg: var(--bg-elevated);
      --host-bd: var(--line);
      font-weight: 500;
    }
    .host-pill.tone-0, .host-chip.tone-0 { --host-fg: #0f766e; --host-bg: #ccfbf1; --host-bd: #5eead4; }
    .host-pill.tone-1, .host-chip.tone-1 { --host-fg: #b45309; --host-bg: #ffedd5; --host-bd: #fdba74; }
    .host-pill.tone-2, .host-chip.tone-2 { --host-fg: #1d4ed8; --host-bg: #dbeafe; --host-bd: #93c5fd; }
    .host-pill.tone-3, .host-chip.tone-3 { --host-fg: #be123c; --host-bg: #ffe4e6; --host-bd: #fda4af; }
    .host-pill.tone-4, .host-chip.tone-4 { --host-fg: #3f6212; --host-bg: #ecfccb; --host-bd: #bef264; }
    .host-pill.tone-5, .host-chip.tone-5 { --host-fg: #0e7490; --host-bg: #cffafe; --host-bd: #67e8f9; }
    .host-pill.tone-6, .host-chip.tone-6 { --host-fg: #a16207; --host-bg: #fef9c3; --host-bd: #fde047; }
    .host-pill.tone-7, .host-chip.tone-7 { --host-fg: #9a3412; --host-bg: #ffedd5; --host-bd: #fb923c; }
    .host-pill.bad {
      opacity: 0.72;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }
    .host-pill.pending {
      opacity: 0.78;
      border-style: dashed;
    }
    .host-pill.pending::after {
      content: "";
      display: inline-block;
      width: 0.55em;
      height: 0.55em;
      margin-left: 0.35em;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      border-right-color: transparent;
      vertical-align: -0.05em;
      animation: host-spin 0.7s linear infinite;
    }
    @keyframes host-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .host-pill.pending::after { animation: none; border-right-color: currentColor; opacity: 0.5; }
    }
    .host-pill.active {
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--host-fg, var(--accent)) 55%, transparent);
      opacity: 1;
    }
    /* Online but idle: mute colors only — avoid filter (breaks flex wrap / overflow). */
    .host-pill.empty:not(.active):not(.bad) {
      --host-fg: var(--muted);
      --host-bg: color-mix(in srgb, var(--line) 42%, var(--card));
      --host-bd: var(--line);
      font-weight: 500;
      box-shadow: none;
      opacity: 0.72;
    }
    .host-pill.empty:not(.active):not(.bad):hover,
    .host-pill.empty:not(.active):not(.bad):focus-visible {
      opacity: 0.92;
      --host-bd: color-mix(in srgb, var(--muted) 35%, var(--line));
    }
    .host-pill.dim {
      opacity: 0.4;
      box-shadow: none;
    }
    .host-pill.dim:hover,
    .host-pill.dim:focus-visible {
      opacity: 0.7;
    }
    .host-pill .count {
      font-weight: 500;
      opacity: 0.88;
      margin-left: 0.15em;
    }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px 10px;
      margin-top: 6px;
    }
    .filter-bar:empty { display: none; }
    .agent-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .agent-filter-label { color: var(--muted); font-size: 0.68rem; line-height: 1.2; margin-right: 2px; }
    .agent-filter {
      appearance: none;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-elevated);
      color: var(--muted);
      line-height: 1.2;
      cursor: pointer;
    }
    .agent-filter[aria-pressed="true"] {
      color: var(--fg);
      background: var(--card);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .agent-filter .count { margin-left: 5px; font-family: var(--mono); font-variant-numeric: tabular-nums; opacity: 0.75; }
    .agent-filter:active { background: color-mix(in srgb, var(--accent) 12%, var(--card)); }
    .agent-filter:focus-visible, .other-agent-wait:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .other-agent-wait {
      display: block;
      margin-top: 6px;
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: var(--wait);
      font: 500 0.74rem var(--font);
      text-align: left;
      cursor: pointer;
    }
    .agent-filters[hidden], .other-agent-wait[hidden], .agent-usage[hidden], .usage-panel[hidden] { display: none; }
    .agent-usage:not([hidden]) {
      display: contents;
    }
    .usage-bar-head {
      display: inline-flex;
      align-items: center;
      margin-left: auto;
    }
    .usage-toggle {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg-elevated);
      color: var(--muted);
      line-height: 1.2;
      cursor: pointer;
      font-variant-numeric: tabular-nums;
    }
    .usage-toggle:hover, .usage-toggle:focus-visible {
      color: var(--fg);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    }
    .usage-toggle[aria-expanded="true"] {
      color: var(--fg);
      background: var(--card);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .usage-toggle.tone-warn {
      border-color: color-mix(in srgb, var(--wait) 50%, var(--line));
    }
    .usage-toggle.tone-danger {
      color: var(--fg);
      border-color: color-mix(in srgb, var(--danger) 60%, var(--line));
    }
    .usage-mini-gauges {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
      padding: 1px 2px;
      border-radius: 3px;
      background: color-mix(in srgb, var(--line) 55%, transparent);
    }
    .usage-mini-col {
      width: 3.5px;
      height: 9px;
      border-radius: 1.5px;
      background: color-mix(in srgb, var(--line) 90%, transparent);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }
    .usage-mini-fill {
      width: 100%;
      border-radius: 1.5px;
      background: var(--accent);
    }
    .usage-mini-fill.tone-warn { background: var(--wait); }
    .usage-mini-fill.tone-danger { background: var(--danger); }
    .usage-chev {
      font-size: 0.62rem;
      opacity: 0.75;
    }
    .usage-panel {
      flex: 0 0 100%;
      width: 100%;
      margin-top: 4px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
    }
    .usage-panel:not([hidden]) {
      animation: usage-expand 180ms var(--ease);
    }
    @keyframes usage-expand {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .usage-panel:not([hidden]) {
        animation: none;
      }
    }
    .usage-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .usage-panel-title {
      font-weight: 600;
      color: var(--fg);
    }
    .usage-panel-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .usage-refresh {
      appearance: none;
      font: 600 0.68rem var(--font);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      color: var(--fg);
      cursor: pointer;
    }
    .usage-refresh:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .usage-close {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font: 600 0.68rem/1 var(--font);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: var(--bg-elevated);

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
        </button>

      <span class="reader-status" id="reader-status" aria-live="polite"></span>

  </div>

  <script>
    const SECTIONS = [
      ['wait', '等待回覆'],
      ['review', '待看'],
      ['idle', '閒置'],
      ['running', '進行中'],
      ['shell', '其他 pane'],
    ];
    const SECTION_EMOJI = { wait: '🙋', review: '👀', running: '🏃', idle: '💤', shell: '💻' };
    // Reasons that only repeat what the emoji, badge and section title already say.
    const GENERIC_REASONS = new Set(['已完成，尚未查看', '已完成，已查看', '閒置，等待新任務', '正在工作']);
    let selectedKey = '';
    let latestAgents = [];
    let latestHosts = [];
    let latestPayload = null;
    let hostFilters = new Set(); // empty = show all hosts
    const refreshPendingHosts = new Set();
    const AGENT_FILTER_STORE = 'tmux-attn:agent-filter';
    const AGENT_LABELS = { codex: 'Codex', claude: 'Claude', pi: 'Pi', cursor: 'Cursor', opencode: 'OpenCode' };
    const USAGE_PROVIDERS = ['codex', 'claude', 'cursor'];
    const USAGE_POLL_MS = 60_000;
    let usageByProvider = new Map();
    let usageFetchedAt = new Map();
    let usageUpdatedAt = 0;
    let usageExpanded = false;
    let usageRefreshing = false;
    let usageReqSeq = 0;
    let agentFilter = readAgentFilter();
    const NOTIFY_STORE = 'tmux-attn:notify';
    const FAVICON_CALM_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="tmux Attention"><rect width="32" height="32" rx="8" fill="#0f766e"/><rect x="5" y="5" width="10" height="10" rx="2.2" fill="#2a9d8f"/><rect x="5" y="17" width="10" height="10" rx="2.2" fill="#2a9d8f"/><rect x="17" y="17" width="10" height="10" rx="2.2" fill="#2a9d8f"/><rect x="17" y="5" width="10" height="10" rx="2.2" fill="#2a9d8f"/></svg>';
    const FAVICON_BADGE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="tmux Attention — needs attention"><rect width="32" height="32" rx="8" fill="#0f766e"/><rect x="5" y="5" width="10" height="10" rx="2.2" fill="#2a9d8f"/><rect x="5" y="17" width="10" height="10" rx="2.2" fill="#2a9d8f"/><rect x="17" y="17" width="10" height="10" rx="2.2" fill="#2a9d8f"/><rect x="17" y="5" width="10" height="10" rx="2.2" fill="#f8fafc"/><circle cx="25" cy="7" r="5.5" fill="#0f766e"/><circle cx="25" cy="7" r="4.2" fill="#ef4444"/></svg>';
    const BELL_ON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>';
    const BELL_OFF_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
    let notifyEnabled = readNotifyPref();
    const notifiedHostSeeded = new Set();
    const prevAgentNotifyState = new Map();
    let activeGroup = '';
    let laterExpanded = false;
    const laterBusy = new Set();
    let sheetOpen = false;
    let sheetPreviewKey = '';
    let sheetPreviewFull = false;
    let sheetPreviewUpdated = 0;
    let sheetPreviewRevision = 0;
    let sheetPreviewToken = 0;
    const acknowledgedVersions = new Map();
    const acknowledgementsInFlight = new Map();
    const PEER_OUTDATED = 'peer is running an older tmux-attn without this feature';
    const READER_PREFIX = '#/m/';
    const READER_SIG_CHARS = 200;
    let sheetPreviewData = { users: [], agent: '' };
    let readerOpen = false;
    let readerHash = '';
    let readerPushed = false;
    let readerToken = 0;
    let readerText = '';
    let routeSettled = false;
    const readerSigs = new Map();
    const READER_SIG_STORE = 'attn.readerSigs';
    // Only the current sheet snapshot is cached (at most three prompts and one reply).
    const readerMessages = new Map();
    const replyDrafts = new Map();
    const DRAFT_STORE_PREFIX = 'attn.replyDraft.';
    const MAX_ATTACHMENTS = 4;
    const MAX_IMAGE_EDGE = 2048;
    const MAX_ATTACHMENT_BYTES = 8 * 1024 * 1024;
    const UPLOADING_NOTICE = '附件上傳中，請稍候再送出';
    let attachments = []; // { key, name, kind, previewUrl, status, uploadId, error }
    let attachmentSeq = 0;
    const STALE_HOST_TTL_MS = 35000;
    const lastGoodByHost = new Map();

    function agentKey(a) {
      return [a.host || '', a.pane || '', a.pid || ''].join('|');
    }
    function saveReplyDraft(key, text) {
      if (!key) return;
      replyDrafts.set(key, text);
      try {
        if (text) localStorage.setItem(DRAFT_STORE_PREFIX + key, text);
        else localStorage.removeItem(DRAFT_STORE_PREFIX + key);
      } catch (_) { /* Keep drafts in memory when browser storage is unavailable. */ }
    }
    function readReplyDraft(key) {
      if (replyDrafts.has(key)) return replyDrafts.get(key);
      try {
        return localStorage.getItem(DRAFT_STORE_PREFIX + key) || '';
      } catch (_) {
        return replyDrafts.get(key) || '';
      }
    }
    function saveCurrentReplyDraft() {
      if (sheetOpen) saveReplyDraft(selectedKey, document.getElementById('sheet-text').value);
    }
    // Both commands pin the deployed code to the hub's own commit, so a peer converges on the hub, not on main.
    const updateCommand = hub => `tmux-attn update --ref ${hub}`;
    const bootstrapCommand = hub => `curl -fsSL https://raw.githubusercontent.com/cubrady/tmux-attn/main/update.sh | TMUX_ATTN_REF=${hub} sh`;
    let updateHintHtml = '';
    function shortVersion(version) {
      return String(version || '').slice(0, 7);
    }
    // Wait for each peer's response before comparing versions; pending peers have no version yet.
    // A peer that responds without a version predates `tmux-attn update`.
    function renderUpdateHint(hosts, hubVersion) {
      const el = document.getElementById('update-hint');
      const behind = /^[0-9a-f]{7,40}$/.test(hubVersion)
        ? hosts.filter(h => !h.pending && h.ok && h.source === 'peer' && (h.version || '') !== hubVersion) : [];
      el.hidden = behind.length === 0;
      const rows = behind.map(h => {
        const cmd = h.version ? updateCommand(hubVersion) : bootstrapCommand(hubVersion);
        const state = `${h.version ? shortVersion(h.version) : '未回報版本'} → hub ${shortVersion(hubVersion)}`;
        return `<div class="update-row"><div class="update-host"><strong>${escapeHtml(h.name)}</strong>` +
          `<span class="update-state">${escapeHtml(state)}</span></div>` +
          `<div class="update-cmd"><code>${escapeHtml(cmd)}</code>` +
          `<button type="button" class="copy-cmd" data-copy="${escapeHtml(cmd)}">複製</button></div></div>`;
      });
      const html = behind.length ? '<div class="update-title">版本與 hub 不一致，請在該主機執行：</div>' + rows.join('') : '';
      // The poll renders every 20s; rewriting identical markup would drop a text selection and the 已複製 label.
      if (html !== updateHintHtml) {
        updateHintHtml = html;
        el.innerHTML = html;
      }
    }
    function projectName(a) {
      return clipText(a.project || a.repo || a.window, 80) || '未命名專案';
    }
    function agentName(a) {
      return projectName(a);
    }
    function clipText(value, limit) {
      return typeof value === 'string' ? value.slice(0, limit) : '';
    }
    function taskHint(a) {
      // Literal excerpts only: never invent a topic from a branch, state or id.
      const generic = /^(?:(?:please|pls|can you|could you)\s+)?(?:continue|go on|carry on|resume|status(?: check| update)?|check (?:the )?(?:status|progress)|(?:any )?(?:progress|updates?)(?: check| update)?|how(?:'s| is) (?:it|the task|the progress)(?: going)?|result(?: \d+)?|done|finished|summary|your decisions?|decisions? (?:needed|required)|(?:請|请)?(?:繼續|继续|接著|接着|狀態(?:檢查|更新)?|状态(?:检查|更新)?|(?:目前)?進度(?:如何|怎樣|怎麼樣|檢查|更新)?|(?:目前)?进度(?:如何|怎样|怎么样|检查|更新)?|好了嗎|好了吗|完成了嗎|完成了吗)|要你決定|需要你決定|請你決定|結果|结果)[\s.!?？。:：]*$/i;
      function excerpt(value) {
        const text = clipText(value, 512);
        let fenced = false;
        for (const raw of text.split('\n')) {
          if (/^\s*(?:```|~~~)/.test(raw)) { fenced = !fenced; continue; }
          if (fenced || /^\s*>/.test(raw)) continue;
          const line = raw.replace(/^\s*(?:#{1,6}\s*|\d{1,2}[.)、]\s+|[-*]\s+)/, '').replace(/[*_`]/g, '').replace(/\s+/g, ' ').trim();
          if (!line || generic.test(line)) continue;
          const sentence = line.match(/^[^。！？?]+[。！？?]?/)?.[0] || line;
          return sentence.length > 56 ? sentence.slice(0, 55) + '…' : sentence;
        }
        return '';
      }
      const users = Array.isArray(a.preview?.users) ? a.preview.users.slice(-3) : [];
      for (let i = users.length - 1; i >= 0; i--) {
        const hint = excerpt(users[i]);
        if (hint) return hint;
      }
      return excerpt(a.preview?.agent);
    }
    // Prefer the title the agent gave this session.
    function sessionLabel(a) {
      return clipText(a.title, 80).trim();
    }
    function sessionTitle(a) {
      return [agentName(a), taskHint(a)].filter(Boolean).join(' · ');
    }
    // Same identity the card shows: project name, then the agent session title when present.
    function cardIdentity(a) {
      return { name: projectName(a), context: sessionLabel(a) };
    }
    function identityLine(a, sep = ' · ') {
      const { name, context } = cardIdentity(a);
      return [name, context].filter(Boolean).join(sep);
    }
    // Branch/dirty live on the message detail (and sheet), not the card glance row.
    function gitStateBits(a) {
      const bits = [];
      const branch = clipBranch(a.branch || '');
      if (branch) bits.push(branch);
      if (a.dirty) bits.push('dirty');
      return bits;
    }
    function readerSubLine(a, chars) {
      const bits = [identityLine(a), ...gitStateBits(a)];
      if (chars !== undefined) bits.push(`${Number(chars) || 0} 字`);
      return bits.filter(Boolean).join(' · ');
    }
    function hostTone(name) {
      const text = String(name || '');
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return Math.abs(hash) % 8;
    }
    function agentHostName(a) {
      return a.host || latestHosts.find(h => h.source === 'local')?.name || 'local';
    }
    // One machine needs no label. Two or more: every card names its machine, even while a filter is on.
    function showHostChips() {
      return latestHosts.length > 1;
    }
    const HOST_CHIP_LIMIT = 16;
    function hostChipHtml(agent) {
      if (!showHostChips()) return '';
      const name = agentHostName(agent);
      if (!name) return '';
      const label = name.length > HOST_CHIP_LIMIT ? name.slice(0, HOST_CHIP_LIMIT - 1) + '…' : name;
      return `<span class="host-chip tone-${hostTone(name)}" title="${escapeHtml(name)}">${escapeHtml(label)}</span>`;
    }
    function hostVisibleAgents() {
      if (!hostFilters.size) return latestAgents;
      return latestAgents.filter(a => hostFilters.has(agentHostName(a)));
    }
    function agentKind(agent) {
      const name = String(agent.agent || agent.cli || '').toLowerCase();
      if (name === 'agent') return 'cursor';
      return Object.hasOwn(AGENT_LABELS, name) ? name : '';
    }
    function readAgentFilter() {
      try {
        const saved = sessionStorage.getItem(AGENT_FILTER_STORE);
        return Object.hasOwn(AGENT_LABELS, saved) ? saved : '';
      } catch (_) { return ''; }
    }
    function setAgentFilter(name) {
      agentFilter = Object.hasOwn(AGENT_LABELS, name) ? name : '';
      try {
        if (agentFilter) sessionStorage.setItem(AGENT_FILTER_STORE, agentFilter);
        else sessionStorage.removeItem(AGENT_FILTER_STORE);
      } catch (_) { /* Filtering still works when storage is unavailable. */ }
    }
    function visibleAgents() {
      const agents = hostVisibleAgents();
      return agentFilter ? agents.filter(a => category(a) !== 'shell' && agentKind(a) === agentFilter) : agents;
    }
    function renderAgentFilters() {
      const agents = hostVisibleAgents().filter(a => category(a) !== 'shell');
      const counts = new Map();
      for (const agent of agents) {
        const name = agentKind(agent);
        if (name) counts.set(name, (counts.get(name) || 0) + 1);
      }
      // Cold loads arrive one host at a time. Do not discard a restored choice
      // before the selected hosts have finished loading.
      const pending = latestHosts.some(h => h.pending && (!hostFilters.size || hostFilters.has(h.name))) ||
        [...refreshPendingHosts].some(name => !hostFilters.size || hostFilters.has(name));
      if (agentFilter && !counts.has(agentFilter) && !pending) setAgentFilter('');
      const row = document.getElementById('agent-filters');
      row.hidden = !counts.size;
      const button = (name, label, count) => `<button type="button" class="agent-filter" data-agent-filter="${name}" aria-pressed="${agentFilter === name}">${label}<span class="count">${count}</span></button>`;
      const markup = '<span class="agent-filter-label" aria-hidden="true">Agent</span>' + button('', '全部', agents.length) +
        Object.entries(AGENT_LABELS).filter(([name]) => counts.has(name)).map(([name, label]) => button(name, label, counts.get(name))).join('');
      if (row.innerHTML !== markup) {
        const focused = document.activeElement?.closest?.('[data-agent-filter]')?.dataset.agentFilter;
        row.innerHTML = markup;
        if (focused !== undefined) {
          (row.querySelector(`[data-agent-filter="${focused}"]`) || row.querySelector('[data-agent-filter=""]'))?.focus();
        }
      }
      const others = agentFilter ? agents.filter(a => agentKind(a) !== agentFilter && category(a) === 'wait').length : 0;
      const notice = document.getElementById('other-agent-wait');
      notice.hidden = !others;
      notice.textContent = others ? `其他 agent 有 ${others} 個等你 · 查看全部 →` : '';
      renderAgentUsage();
      syncAgentUsage();
    }
    function activeUsageProviders() {
      if (agentFilter) {
        return USAGE_PROVIDERS.filter(p => p === agentFilter);
      }
      return USAGE_PROVIDERS.slice();
    }
    function usageToneForWindow(win) {
      const pct = Number(win?.usedPercent) || 0;
      if (pct >= 100) return 'danger';
      if (pct >= 75 || win?.pace?.willLastToReset === false) return 'warn';
      return 'ok';
    }
    function usageToneForAccount(acc) {
      let tone = 'ok';
      for (const win of acc?.windows || []) {
        const wTone = usageToneForWindow(win);
        if (wTone === 'danger') return 'danger';
        if (wTone === 'warn') tone = 'warn';
      }
      return tone;
    }
    function formatUsageDurationSec(sec) {
      const totalMin = Math.max(1, Math.ceil((Number(sec) || 0) / 60));
      if (totalMin < 60) return `${totalMin}m`;
      if (totalMin < 1440) {
        const h = Math.floor(totalMin / 60);
        const m = totalMin % 60;
        return m ? `${h}h ${m}m` : `${h}h`;
      }
      const d = Math.floor(totalMin / 1440);
      const h = Math.floor((totalMin % 1440) / 60);
      return h ? `${d}d ${h}h` : `${d}d`;
    }
    function formatResetCountdown(resetsAt) {
      if (!resetsAt) return '';
      const targetMs = Date.parse(resetsAt);
      if (!Number.isFinite(targetMs)) return '';
      const diffSec = Math.floor((targetMs - Date.now()) / 1000);
      if (diffSec <= 0) return '';
      return formatUsageDurationSec(diffSec);
    }
    function formatLocalResetClock(resetsAt) {
      if (!resetsAt) return '';
      const targetMs = Date.parse(resetsAt);
      if (!Number.isFinite(targetMs)) return '';
      const d = new Date(targetMs);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const diffHours = Math.abs(targetMs - Date.now()) / 3600000;
      if (diffHours <= 20) return `${hh}:${mm}`;
      return `${d.getMonth() + 1}/${d.getDate()} ${hh}:${mm}`;
    }
    function formatResetDetail(resetsAt, resetDescription) {
      const countdown = formatResetCountdown(resetsAt);
      const clock = formatLocalResetClock(resetsAt);
      if (countdown && clock) return `${countdown} 後重置 (${clock})`;
      if (countdown) return `${countdown} 後重置`;
      const desc = String(resetDescription || '').trim();
      return desc ? `重置 ${desc}` : '';
    }
    function remainingPercentForWindow(win) {
      const used = Math.max(0, Math.min(100, Math.round(Number(win?.usedPercent) || 0)));
      return 100 - used;
    }
    function formatWindowPillSummary(win) {
      const remain = remainingPercentForWindow(win);
      const label = escapeHtml(win?.shortLabel || win?.label || '');
      const cd = remain <= 0 ? formatResetCountdown(win?.resetsAt) : '';
      return `${label} 剩 ${remain}%${cd ? ` (${escapeHtml(cd)})` : ''}`;
    }
    function renderAgentUsage() {
      const box = document.getElementById('agent-usage');
      if (!box) return;
      const providers = activeUsageProviders();
      const accounts = [];
      for (const p of providers) {
        const rows = usageByProvider.get(p) || [];
        for (const row of rows) {
          if (row && Array.isArray(row.windows) && row.windows.length) accounts.push(row);
        }
      }
      if (!providers.length || !accounts.length) {
        box.hidden = true;
        box.innerHTML = '';
        return;
      }
      box.hidden = false;
      let overallTone = 'ok';
      const miniColsHtml = accounts.map(acc => {
        const tone = usageToneForAccount(acc);
        if (tone === 'danger') overallTone = 'danger';
        else if (tone === 'warn' && overallTone !== 'danger') overallTone = 'warn';
        const minRemain = (acc.windows || []).reduce((m, w) => Math.min(m, remainingPercentForWindow(w)), 100);
        const hPct = Math.max(16, minRemain);
        return `<span class="usage-mini-col"><span class="usage-mini-fill tone-${tone}" style="height:${hPct}%"></span></span>`;
      }).join('');
      const toggleHtml = `<button type="button" class="usage-toggle tone-${overallTone}" data-usage-toggle aria-expanded="${usageExpanded ? 'true' : 'false'}" aria-controls="usage-panel">` +
        `<span class="usage-mini-gauges" aria-hidden="true">${miniColsHtml}</span>` +
        `<span>用量</span>` +
        `<span class="usage-chev" aria-hidden="true">${usageExpanded ? '▴' : '▾'}</span>` +
      `</button>`;
      const ageSec = usageUpdatedAt > 0 ? Math.max(0, Math.floor(Date.now() / 1000) - usageUpdatedAt) : null;
      const ageText = ageSec === null ? '' : (ageSec < 60 ? '剛剛更新' : `${Math.floor(ageSec / 60)} 分鐘前更新`);
      const cardsHtml = accounts.map(acc => {
        const providerName = AGENT_LABELS[acc.provider] || acc.provider || '';
        const acctLabel = acc.label || acc.account || providerName;
        const badge = cliBadge(acc.provider, true);
        const winsHtml = (acc.windows || []).map(win => {
          const remainPct = remainingPercentForWindow(win);
          const wTone = usageToneForWindow(win);
          const shortReset = formatResetCountdown(win.resetsAt) || formatLocalResetClock(win.resetsAt);
          const resetInfo = formatResetDetail(win.resetsAt, win.resetDescription);
          const expectedRemainPct = Number.isFinite(win.pace?.expectedUsedPercent)
            ? Math.max(0, Math.min(100, 100 - Math.round(win.pace.expectedUsedPercent)))
            : null;
          const expectedTick = expectedRemainPct !== null && expectedRemainPct > 0 && expectedRemainPct < 100
            ? `<span class="usage-bar-expected" style="left:${expectedRemainPct}%" title="預期剩餘 ${expectedRemainPct}%"></span>`
            : '';
          let paceHtml = '';
          if (remainPct <= 0) {
            paceHtml = `<div class="usage-pace tone-danger">⛔ 已用盡${resetInfo ? ` · ${escapeHtml(resetInfo)}` : ''}</div>`;
          } else if (win.pace && win.pace.willLastToReset === false) {
            const delta = Number.isFinite(win.pace.deltaPercent) && win.pace.deltaPercent > 0 ? `超前 ${win.pace.deltaPercent}%` : '消耗偏快';
            const eta = Number.isFinite(win.pace.etaSeconds) && win.pace.etaSeconds > 0
              ? ` · 預計 ${formatUsageDurationSec(win.pace.etaSeconds)} 後用盡`
              : '';
            paceHtml = `<div class="usage-pace">⚡ ${escapeHtml(delta + eta)}</div>`;
          }
          return `<div class="usage-win">` +
            `<div class="usage-meter-row" title="${escapeHtml(`${win.label || win.shortLabel}: 剩餘 ${remainPct}%${resetInfo ? ` · ${resetInfo}` : ''}`)}">` +
              `<span class="usage-win-tag">${escapeHtml(win.shortLabel || win.label)}</span>` +
              `<div class="usage-bar" role="progressbar" aria-label="${escapeHtml(win.label || win.shortLabel)}" aria-valuenow="${remainPct}" aria-valuemin="0" aria-valuemax="100">` +
                `<div class="usage-bar-fill tone-${wTone}" style="width:${remainPct}%"></div>` +
                expectedTick +
              `</div>` +
              `<span class="usage-win-stat">` +
                `<span class="usage-win-pct tone-${wTone}">剩 ${remainPct}%</span>` +
                (shortReset ? `<span class="usage-win-reset">${escapeHtml(shortReset)}</span>` : '') +
              `</span>` +
            `</div>` +
            paceHtml +
          `</div>`;
        }).join('');
        return `<div class="usage-card" data-usage-provider="${escapeHtml(acc.provider)}" data-usage-account="${escapeHtml(acc.account || acc.label)}">` +
          `<div class="usage-card-head">` +
            `<span class="usage-card-id" title="${escapeHtml(`${providerName} · ${acc.account || acctLabel}`)}">${badge}<span>${escapeHtml(acctLabel)}</span></span>` +
            (acc.plan ? `<span class="usage-plan">${escapeHtml(acc.plan)}</span>` : '') +
          `</div>` +
          winsHtml +
        `</div>`;
      }).join('');
      const panelHtml = `<div class="usage-panel" id="usage-panel"${usageExpanded ? '' : ' hidden'}>` +
        `<div class="usage-panel-head">` +
          `<span class="usage-panel-title">剩餘額度與重置時間</span>` +
          `<span class="usage-panel-actions">` +

        if (typeof localStorage !== 'undefined') {
          const saved = parseFloat(localStorage.getItem(FONT_SCALE_KEY));
          if (Number.isFinite(saved) && saved >= FONT_SCALE_MIN && saved <= FONT_SCALE_MAX) {
            fontScale = Math.round(saved * 10) / 10;
          }
        }
      } catch (_) {}
      applyFontScale(fontScale);
      updateFontControls();
    }

    const POLL_MS = 20000;
    let refreshInFlight = false;
    let hasLoaded = false;
    let lastSuccessAt = 0;
    let refreshEpoch = 0;
    const hostSliceByName = new Map();
    const REFRESH_HINT_MIN_MS = 280;

    function setColdSkeleton(on) {
      document.body.classList.toggle('is-loading', on);
      const clock = document.getElementById('clock');
      if (on) {
        clock.textContent = '…';
        clock.dataset.state = 'loading';
      }
    }

    function setRefreshing(on) {
      const header = document.querySelector('header');
      const bar = document.getElementById('refresh-bar');
      if (header) header.classList.toggle('is-refreshing', on);
      if (bar) {
        bar.hidden = !on;
        bar.setAttribute('aria-hidden', on ? 'false' : 'true');
      }
      if (on) paintClock('updating');
    }

    function formatSuccessAge(ms) {
      const sec = Math.max(0, Math.floor(ms / 1000));
      if (sec < 5) return '剛剛';
      if (sec < 60) return sec + ' 秒前';
      const min = Math.floor(sec / 60);
      if (min < 60) return min + ' 分鐘前';
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + ' 小時前';
      return Math.floor(hr / 24) + ' 天前';
    }

    function paintClock(state) {
      const clock = document.getElementById('clock');
      if (!clock) return;
      if (state) clock.dataset.state = state;
      const mode = clock.dataset.state;
      if (mode === 'loading') {
        clock.textContent = '…';
        return;
      }
      if (mode === 'offline') {
        clock.textContent = lastSuccessAt ? ('離線 · ' + formatSuccessAge(Date.now() - lastSuccessAt)) : 'offline';
        return;
      }
      if (!lastSuccessAt) {
        clock.textContent = mode === 'updating' ? '更新中' : '…';
        return;
      }
      const age = formatSuccessAge(Date.now() - lastSuccessAt);
      clock.textContent = mode === 'updating' ? ('更新中 · ' + age) : age;
      clock.title = new Date(lastSuccessAt).toLocaleString();
    }

    function markSuccess() {
      lastSuccessAt = Date.now();
      paintClock(document.getElementById('clock')?.dataset.state === 'updating' ? 'updating' : 'live');
    }

    function assembleFleet(version) {
      const hosts = [];
      const agents = [];
      const summaries = [];
      for (const slice of hostSliceByName.values()) {
        const host = slice.hosts && slice.hosts[0];
        if (host) hosts.push(host);
        if (slice.agents) agents.push(...slice.agents);
        if (slice.summary) summaries.push(slice.summary);
      }
      hosts.sort((a, b) => {
        const ap = a.pending ? 1 : 0, bp = b.pending ? 1 : 0;
        if (ap !== bp) return ap - bp;
        const ao = a.ok ? 0 : 1, bo = b.ok ? 0 : 1;
        if (ao !== bo) return ao - bo;
        return String(a.name || '').localeCompare(String(b.name || ''));
      });
      agents.sort((a, b) => (b.updated || 0) - (a.updated || 0));
      const summary = { wait: 0, review: 0, review_seen: 0, running: 0, idle: 0, tracked: 0, untracked: 0 };
      for (const part of summaries) {
        for (const key of Object.keys(summary)) summary[key] += Number(part[key] || 0);
      }
      return { ok: true, hosts, agents, summary, version: version || (latestPayload && latestPayload.version) || '' };
    }

    function applyHostSlice(slice, version) {
      const host = slice.hosts && slice.hosts[0];
      if (!host || !host.name) return;
      hostSliceByName.set(host.name, {
        hosts: [host],
        agents: slice.agents || [],
        summary: slice.summary || {},
      });
      render(assembleFleet(version || slice.version));
      markSuccess();
      if (!hasLoaded) {
        hasLoaded = true;
        setColdSkeleton(false);
      }
    }

    function seedPendingHosts(plan) {
      for (const row of plan.hosts || []) {
        if (!row.name || hostSliceByName.has(row.name)) continue;
        hostSliceByName.set(row.name, {
          hosts: [{ name: row.name, source: row.source || '', ok: true, pending: true }],
          agents: [],
          summary: {},
        });
      }
      render(assembleFleet(plan.version));
    }

    async function readJsonResponse(result) {
      if (result.error) throw result.error;
      const res = result.res;
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'payload error');
      return data;
    }

    async function fetchFleetPlan() {
      const early = window.initialFleetPlanRequest;
      window.initialFleetPlanRequest = null;
      const result = early ? await early : { res: await fetch('/api/fleet/plan', { cache: 'no-store' }) };
      return readJsonResponse(result);
    }

    async function fetchHostSlice(name) {
      const res = await fetch('/api/fleet/host?name=' + encodeURIComponent(name), { cache: 'no-store' });
      return readJsonResponse({ res });
    }

    async function refresh() {
      if (refreshInFlight) return;
      refreshInFlight = true;
      const epoch = ++refreshEpoch;
      const cold = !hasLoaded;
      const started = performance.now();
      if (cold) setColdSkeleton(true);
      else setRefreshing(true);
      let sawHost = false;
      try {
        const plan = await fetchFleetPlan();
        if (epoch !== refreshEpoch) return;
        document.getElementById('error').hidden = true;
        const names = (plan.hosts || []).map(h => h.name).filter(Boolean);
        refreshPendingHosts.clear();
        for (const name of names) refreshPendingHosts.add(name);
        if (cold) seedPendingHosts(plan);
        const nameSet = new Set(names);
        for (const existing of [...hostSliceByName.keys()]) {
          if (!nameSet.has(existing)) hostSliceByName.delete(existing);
        }
        if (!names.length) {
          hostSliceByName.clear();
          render({ ok: true, hosts: [], agents: [], summary: {}, version: plan.version || '' });
          hasLoaded = true;
          setColdSkeleton(false);
          markSuccess();
        } else {
          await Promise.all(names.map(async (name) => {
            try {
              const slice = await fetchHostSlice(name);
              if (epoch !== refreshEpoch) return;
              refreshPendingHosts.delete(name);
              applyHostSlice(slice, plan.version);
              sawHost = true;
            } catch (hostErr) {
              if (epoch !== refreshEpoch) return;
              refreshPendingHosts.delete(name);
              const prev = hostSliceByName.get(name);
              const prevHost = prev && prev.hosts && prev.hosts[0];
              hostSliceByName.set(name, {
                hosts: [{
                  name,
                  source: (prevHost && prevHost.source) || '',
                  url: prevHost && prevHost.url,
                  ok: false,
                  error: hostErr.message || 'failed',
                  stale: !!(prev && prev.agents && prev.agents.length),
                }],
                agents: (prev && prev.agents) || [],
                summary: (prev && prev.summary) || {},
              });
              render(assembleFleet(plan.version));
            }
          }));
        }
        if (epoch !== refreshEpoch) return;
        if (!sawHost) throw new Error('所有主機都無法讀取');
        document.getElementById('error').hidden = true;
        if (cold) {
          setColdSkeleton(false);
        } else {
          const elapsed = performance.now() - started;
          if (elapsed < REFRESH_HINT_MIN_MS) {
            await new Promise(r => setTimeout(r, REFRESH_HINT_MIN_MS - elapsed));
          }
          setRefreshing(false);
        }
        paintClock('live');
      } catch (e) {
        if (epoch !== refreshEpoch) return;
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = '無法讀取狀態：' + e.message;
        if (cold && !hasLoaded) {
          // Stay on skeleton until first successful host.
        } else {
          setRefreshing(false);
        }
        paintClock('offline');
      } finally {
        if (epoch === refreshEpoch) {
          refreshPendingHosts.clear();
          refreshInFlight = false;
        }
      }
    }
    initFontScale();
    paintNotifyButton();
    refresh();
    setInterval(refresh, POLL_MS);
    setInterval(() => {
      const state = document.getElementById('clock')?.dataset.state;
      if (state === 'live' || state === 'offline' || state === 'updating') paintClock();
    }, 1000);
  </script>
</body>
</html>
