<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="tmux attention — multi-host agent status">
  <title>Attention</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@450;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --bg-elevated: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-fg: #f8fafc;
      --wait: #c2410c;
      --review: #0369a1;
      --running: #15803d;
      --idle: #71717a;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --radius: 8px;
      --font: "Outfit", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --max: 42rem;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --header-bg: color-mix(in srgb, var(--bg) 86%, transparent);
      --sheet-bg: #ffffff;
      --scrim: rgb(24 24 27 / 0.42);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0e;
        --bg-elevated: #141417;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --line: #27272a;
        --card: #18181b;
        --accent: #2dd4bf;
        --accent-fg: #042f2e;
        --wait: #fb923c;
        --review: #38bdf8;
        --running: #4ade80;
        --idle: #a1a1aa;
        --danger: #f87171;
        --danger-bg: #450a0a;
        --header-bg: color-mix(in srgb, var(--bg) 88%, transparent);
        --sheet-bg: #18181b;
        --scrim: rgb(0 0 0 / 0.55);
      }
    }
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      font: 15px/1.45 var(--font);
      color: var(--fg);
      background: var(--bg);
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    body.sheet-open { overflow: hidden; }
    .wrap {
      width: min(100%, var(--max));
      margin: 0 auto;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: -4px -8px 0;
      padding: 10px 8px 12px;
      background: var(--header-bg);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--line);
    }
    @media (prefers-reduced-transparency: reduce) {
      header {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: var(--card);
      }
    }
    .brand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
    .live {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .live[data-state="offline"] { color: var(--danger); }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .stat {
      appearance: none;
      display: block;
      width: 100%;
      margin: 0;
      border: 0;
      background: var(--card);
      padding: 10px 6px 9px;
      text-align: center;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .stat:disabled {
      opacity: 0.42;
      cursor: default;
    }
    .stat:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      z-index: 1;
      position: relative;
    }
    .stat.active {
      background: color-mix(in srgb, var(--accent) 12%, var(--card));
    }
    .stat .n {
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .stat .l {
      margin-top: 3px;
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--muted);
    }
    .hosts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }
    .host-pill {
      appearance: none;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      cursor: pointer;
      line-height: 1.2;
      color: var(--host-fg, var(--muted));
      background: var(--host-bg, var(--bg-elevated));
      border-color: var(--host-bd, var(--line));
    }
    .host-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .host-pill.all {
      --host-fg: var(--muted);
      --host-bg: var(--bg-elevated);
      --host-bd: var(--line);
      font-weight: 500;
    }
    .host-pill.tone-0 { --host-fg: #0f766e; --host-bg: #ccfbf1; --host-bd: #5eead4; }
    .host-pill.tone-1 { --host-fg: #b45309; --host-bg: #ffedd5; --host-bd: #fdba74; }
    .host-pill.tone-2 { --host-fg: #1d4ed8; --host-bg: #dbeafe; --host-bd: #93c5fd; }
    .host-pill.tone-3 { --host-fg: #be123c; --host-bg: #ffe4e6; --host-bd: #fda4af; }
    .host-pill.tone-4 { --host-fg: #3f6212; --host-bg: #ecfccb; --host-bd: #bef264; }
    .host-pill.tone-5 { --host-fg: #0e7490; --host-bg: #cffafe; --host-bd: #67e8f9; }
    .host-pill.tone-6 { --host-fg: #a16207; --host-bg: #fef9c3; --host-bd: #fde047; }
    .host-pill.tone-7 { --host-fg: #9a3412; --host-bg: #ffedd5; --host-bd: #fb923c; }
    .host-pill.bad {
      opacity: 0.72;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }
    .host-pill.active {
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--host-fg, var(--accent)) 55%, transparent);
      filter: saturate(1.15);
    }
    @media (prefers-color-scheme: dark) {
      .host-pill.tone-0 { --host-fg: #5eead4; --host-bg: #042f2e; --host-bd: #0f766e; }
      .host-pill.tone-1 { --host-fg: #fdba74; --host-bg: #431407; --host-bd: #c2410c; }
      .host-pill.tone-2 { --host-fg: #93c5fd; --host-bg: #172554; --host-bd: #1d4ed8; }
      .host-pill.tone-3 { --host-fg: #fda4af; --host-bg: #4c0519; --host-bd: #be123c; }
      .host-pill.tone-4 { --host-fg: #bef264; --host-bg: #1a2e05; --host-bd: #4d7c0f; }
      .host-pill.tone-5 { --host-fg: #67e8f9; --host-bg: #083344; --host-bd: #0e7490; }
      .host-pill.tone-6 { --host-fg: #fde047; --host-bg: #422006; --host-bd: #a16207; }
      .host-pill.tone-7 { --host-fg: #fb923c; --host-bg: #431407; --host-bd: #c2410c; }
    }
    main.list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding-bottom: 8px;
    }
    .section {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 12px 0 2px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      scroll-margin-top: 7.5rem;
    }
    .section:first-child { margin-top: 4px; }
    .section .count {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.72rem;
      opacity: 0.9;
    }
    .section[data-group="review"] {
      color: var(--review);
    }
    .section[data-group="review"] .count {
      padding: 1px 6px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--review) 16%, transparent);
      opacity: 1;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px 12px 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--idle);
      transition: border-color 160ms var(--ease), background 160ms var(--ease);
      cursor: pointer;
    }
    .card.shell { cursor: default; }
    @media (prefers-reduced-motion: no-preference) {
      .card { transition: border-color 160ms var(--ease), background 160ms var(--ease), transform 140ms var(--ease); }
      .card:active { transform: scale(0.985); }
    }
    .card.selected {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 6%, var(--card));
    }
    .card.wait { border-left-color: var(--wait); }
    .card.review {
      border-left-color: var(--review);
      background: color-mix(in srgb, var(--review) 7%, var(--card));
    }
    .card.review.newest {
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--review) 40%, transparent);
      background: color-mix(in srgb, var(--review) 11%, var(--card));
    }
    .card.running { border-left-color: var(--running); }
    .card.idle { border-left-color: var(--idle); }
    .card.shell {
      border-left-color: color-mix(in srgb, var(--muted) 40%, var(--line));
      background: color-mix(in srgb, var(--card) 70%, var(--bg));
    }
    .card.error {
      border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
      border-left-color: var(--danger);
      background: var(--danger-bg);
    }
    .row1 {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      justify-content: space-between;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      font-weight: 600;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      min-width: 0;
    }
    .emoji { font-size: 1.05rem; line-height: 1; }
    .project { min-width: 0; overflow-wrap: anywhere; }
    .host {
      font-family: var(--mono);
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 5px;
      color: var(--host-fg, var(--muted));
      background: var(--host-bg, var(--bg));
      border: 1px solid var(--host-bd, var(--line));
    }
    .host.tone-0 { --host-fg: #0f766e; --host-bg: #ccfbf1; --host-bd: #5eead4; }
    .host.tone-1 { --host-fg: #b45309; --host-bg: #ffedd5; --host-bd: #fdba74; }
    .host.tone-2 { --host-fg: #1d4ed8; --host-bg: #dbeafe; --host-bd: #93c5fd; }
    .host.tone-3 { --host-fg: #be123c; --host-bg: #ffe4e6; --host-bd: #fda4af; }
    .host.tone-4 { --host-fg: #3f6212; --host-bg: #ecfccb; --host-bd: #bef264; }
    .host.tone-5 { --host-fg: #0e7490; --host-bg: #cffafe; --host-bd: #67e8f9; }
    .host.tone-6 { --host-fg: #a16207; --host-bg: #fef9c3; --host-bd: #fde047; }
    .host.tone-7 { --host-fg: #9a3412; --host-bg: #ffedd5; --host-bd: #fb923c; }
    @media (prefers-color-scheme: dark) {
      .host.tone-0 { --host-fg: #5eead4; --host-bg: #042f2e; --host-bd: #0f766e; }
      .host.tone-1 { --host-fg: #fdba74; --host-bg: #431407; --host-bd: #c2410c; }
      .host.tone-2 { --host-fg: #93c5fd; --host-bg: #172554; --host-bd: #1d4ed8; }
      .host.tone-3 { --host-fg: #fda4af; --host-bg: #4c0519; --host-bd: #be123c; }
      .host.tone-4 { --host-fg: #bef264; --host-bg: #1a2e05; --host-bd: #4d7c0f; }
      .host.tone-5 { --host-fg: #67e8f9; --host-bg: #083344; --host-bd: #0e7490; }
      .host.tone-6 { --host-fg: #fde047; --host-bg: #422006; --host-bd: #a16207; }
      .host.tone-7 { --host-fg: #fb923c; --host-bg: #431407; --host-bd: #c2410c; }
    }
    .cli {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--bg);
      flex: 0 0 auto;
    }
    .cli img { width: 16px; height: 16px; display: block; }
    .cli .cli-text {
      font-family: var(--mono);
      font-size: 0.58rem;
      font-weight: 500;
      max-width: 26px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
    }
    @media (prefers-color-scheme: dark) {
      .cli.agent img { filter: invert(1); }
    }
    .cli.broken::after {
      content: attr(title);
      font-family: var(--mono);
      font-size: 0.55rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--muted);
      max-width: 26px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
    }
    .age {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
      padding-top: 3px;
    }
    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .env {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      min-width: 0;
    }
    .env .repo { color: color-mix(in srgb, var(--fg) 72%, var(--muted)); }
    .env .branch { color: var(--muted); overflow-wrap: anywhere; }
    .env .dirty {
      color: var(--wait);
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sheet-env {
      margin: 0 0 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.45;
      color: var(--muted);
    }
    .sheet-env .path {
      color: color-mix(in srgb, var(--fg) 78%, var(--muted));
      overflow-wrap: anywhere;
    }
    .sheet-env .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-top: 4px;
      align-items: baseline;
    }
    .sheet-env .branch { color: var(--muted); }
    .sheet-env .dirty { color: var(--wait); }
    .reason {
      margin-top: 7px;
      font-size: 0.88rem;
      color: color-mix(in srgb, var(--fg) 82%, var(--muted));
      text-wrap: pretty;
    }
    .card.error .reason { color: var(--danger); font-weight: 500; }
    .preview {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .preview-line {
      display: grid;
      grid-template-columns: 2.4rem 1fr;
      gap: 8px;
      align-items: start;
      font-size: 0.84rem;
      line-height: 1.4;
    }
    .preview-line .who {
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--muted);
      padding-top: 3px;
    }
    .preview-line.user .text {
      color: var(--fg);
      font-weight: 500;
      text-wrap: pretty;
    }
    .preview-line.user:last-of-type .text { font-weight: 600; }
    .preview-line.agent {
      margin-top: 3px;
      padding-top: 6px;
      border-top: 1px dashed var(--line);
    }
    .preview-line.agent .text {
      color: var(--muted);
      text-wrap: pretty;
    }
    .card .preview-line .text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .card .preview-line .text.md {
      display: block;
      -webkit-line-clamp: unset;
      -webkit-box-orient: unset;
      max-height: 4.9em;
      overflow: hidden;
    }
    .card.review .preview-line.agent .text {
      -webkit-line-clamp: 4;
      color: color-mix(in srgb, var(--fg) 78%, var(--muted));
    }
    .card.review .preview-line.agent .text.md {
      -webkit-line-clamp: unset;
      max-height: 6.6em;
      color: color-mix(in srgb, var(--fg) 78%, var(--muted));
    }
    .sheet-preview .preview-line .text {
      overflow-wrap: anywhere;
    }
    .sheet-preview .preview-line .text.md {
      max-height: none;
      overflow: visible;
    }
    .preview-line .text.md {
      font-size: inherit;
      line-height: 1.45;
    }
    .preview-line .text.md > :first-child { margin-top: 0; }
    .preview-line .text.md > :last-child { margin-bottom: 0; }
    .preview-line .text.md p,
    .preview-line .text.md ul,
    .preview-line .text.md ol,
    .preview-line .text.md pre,
    .preview-line .text.md blockquote,
    .preview-line .text.md table {
      margin: 0.35em 0;
    }
    .preview-line .text.md h1,
    .preview-line .text.md h2,
    .preview-line .text.md h3,
    .preview-line .text.md h4 {
      margin: 0.55em 0 0.25em;
      font-size: 1em;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1.3;
    }
    .preview-line .text.md h1 { font-size: 1.12em; }
    .preview-line .text.md h2 { font-size: 1.06em; }
    .preview-line .text.md ul,
    .preview-line .text.md ol {
      padding-left: 1.25em;
    }
    .preview-line .text.md li { margin: 0.15em 0; }
    .preview-line .text.md li + li { margin-top: 0.1em; }
    .preview-line .text.md code {
      font-family: var(--mono);
      font-size: 0.86em;
      background: color-mix(in srgb, var(--bg) 70%, var(--line));
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    .preview-line .text.md pre {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .preview-line .text.md pre code {
      background: transparent;
      padding: 0;
      font-size: 0.8em;
      line-height: 1.4;
    }
    .preview-line .text.md blockquote {
      border-left: 3px solid var(--line);
      padding-left: 0.75em;
      color: var(--muted);
    }
    .preview-line .text.md a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .preview-line .text.md table {
      border-collapse: collapse;
      font-size: 0.9em;
      width: 100%;
    }
    .preview-line .text.md th,
    .preview-line .text.md td {
      border: 1px solid var(--line);
      padding: 4px 8px;
      text-align: left;
    }
    .preview-line .text.md th {
      background: var(--bg);
      font-weight: 600;
    }
    .preview-line .text.md hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 0.6em 0;
    }
    .preview-line .text.md strong { font-weight: 650; color: var(--fg); }
    .preview-line.agent .text.md strong { color: color-mix(in srgb, var(--fg) 88%, var(--muted)); }
    .empty, .banner-error {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      padding: 24px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .banner-error {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: color-mix(in srgb, var(--danger) 40%, var(--line));
    }

    /* Reply sheet */
    .sheet-root[hidden] { display: none !important; }
    .sheet-root {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim);
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .sheet {
      position: relative;
      z-index: 1;
      width: min(100%, var(--max));
      max-height: min(88dvh, 720px);
      display: flex;
      flex-direction: column;
      background: var(--sheet-bg);
      border: 1px solid var(--line);
      border-bottom: 0;
      border-radius: 16px 16px 0 0;
      padding: 0 14px calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 -12px 40px rgb(0 0 0 / 0.12);
    }
    @media (prefers-reduced-motion: no-preference) {
      .sheet-scrim { animation: fade-in 180ms var(--ease); }
      .sheet { animation: sheet-up 220ms var(--ease); }
    }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sheet-up {
      from { transform: translateY(18px); opacity: 0.85; }
      to { transform: translateY(0); opacity: 1; }
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--line);
      margin: 10px auto 8px;
    }
    .sheet-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .sheet-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .sheet-sub {
      margin-top: 3px;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
    }
    .icon-btn {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      padding: 0;
    }
    .icon-btn svg { width: 18px; height: 18px; display: block; }
    .icon-btn.listening {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 14%, var(--bg));
      color: var(--accent);
    }
    .sheet-reason {
      font-size: 0.88rem;
      color: color-mix(in srgb, var(--fg) 82%, var(--muted));
      margin-bottom: 8px;
      text-wrap: pretty;
    }
    .sheet-preview {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      margin-bottom: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-preview .preview { margin-top: 0; padding-top: 0; border-top: 0; }
    .sheet-compose {
      flex: 0 0 auto;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .sheet-compose textarea {
      width: 100%;
      min-height: 88px;
      max-height: 28dvh;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 11px;
      font: 0.95rem/1.4 var(--font);
      background: var(--bg-elevated);
      color: var(--fg);
      outline: none;
    }
    .sheet-compose textarea:focus {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    }
    .sheet-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .sheet-actions-left,
    .sheet-actions-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .sheet-actions-right { margin-left: auto; }
    .icon-btn.send {
      border: 0;
      background: var(--accent);
      color: var(--accent-fg);
    }
    .icon-btn.send:disabled {
      opacity: 0.45;
      cursor: default;
    }
    @media (prefers-reduced-motion: no-preference) {
      .icon-btn:active { transform: scale(0.97); }
    }
    .icon-btn:disabled { opacity: 0.4; cursor: default; }
    .icon-btn.kill {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 40%, var(--line));
      background: transparent;
    }
    .icon-btn.kill.armed {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }
    .sheet-feedback {
      min-height: 1.1em;
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .sheet-feedback.bad { color: var(--danger); }
    .sheet-feedback.ok { color: var(--running); }
    .voice-hint {
      margin-top: 4px;
      font-size: 0.7rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Attention</h1>
        <div class="live" id="clock">live</div>
      </div>
      <div class="meta" id="meta">載入中…</div>
      <div class="summary" id="summary" aria-live="polite"></div>
      <div class="hosts" id="hosts"></div>
    </header>
    <main class="list" id="list"></main>
    <div class="empty" id="empty" hidden></div>
    <div class="banner-error" id="error" hidden></div>
  </div>

  <div class="sheet-root" id="sheet-root" hidden>
    <button type="button" class="sheet-scrim" id="sheet-scrim" aria-label="關閉"></button>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-top">
        <div>
          <h2 class="sheet-title" id="sheet-title">回覆</h2>
          <div class="sheet-sub" id="sheet-target"></div>
        </div>
        <button type="button" class="icon-btn" id="sheet-close" aria-label="關閉">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-env" id="sheet-env" hidden></div>
      <div class="sheet-reason" id="sheet-reason"></div>
      <div class="sheet-preview" id="sheet-preview"></div>
      <form class="sheet-compose" id="sheet-form">
        <textarea id="sheet-text" placeholder="輸入訊息，或按麥克風語音輸入" enterkeyhint="send"></textarea>
        <div class="sheet-actions">
          <div class="sheet-actions-left">
            <button type="button" class="icon-btn" id="sheet-mic" aria-label="語音輸入" title="語音輸入">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3"/>
                <path d="M5 11a7 7 0 0 0 14 0"/>
                <path d="M12 18v3"/>
              </svg>
            </button>
          </div>
          <div class="sheet-actions-right">
            <button type="button" class="icon-btn kill" id="sheet-kill" aria-label="關閉 pane" title="關閉 pane（需按兩次）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6h18"/>
                <path d="M8 6V4h8v2"/>
                <path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6M14 11v6"/>
              </svg>
            </button>
            <button type="submit" class="icon-btn send" id="sheet-send" aria-label="送出" title="送出">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 2L11 13"/>
                <path d="M22 2L15 22l-4-9-9-4 20-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="sheet-feedback" id="sheet-status" aria-live="polite"></div>
        <div class="voice-hint" id="voice-hint" hidden></div>
      </form>
    </div>
  </div>

  <script>
    const SECTIONS = [
      ['wait', '等待回覆'],
      ['review', '待查看'],
      ['running', '進行中'],
      ['idle', '閒置'],
      ['shell', '其他 pane'],
    ];
    const SECTION_EMOJI = { wait: '🙋', review: '👀', running: '🏃', idle: '💤', shell: '💻' };
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    let selectedKey = '';
    let latestAgents = [];
    let latestHosts = [];
    let latestPayload = null;
    let hostFilter = '';
    let activeGroup = '';
    let sheetOpen = false;
    let sheetPreviewKey = '';
    let sheetPreviewFull = false;
    let sheetPreviewUpdated = 0;
    let sheetPreviewToken = 0;
    let recognition = null;
    let listening = false;
    let speechBase = '';

    function agentKey(a) {
      return [a.host || '', a.pane || '', a.pid || ''].join('|');
    }
    function hostTone(name) {
      const text = String(name || '');
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return Math.abs(hash) % 8;
    }
    function agentHostName(a) {
      return a.host || latestHosts.find(h => h.source === 'local')?.name || 'local';
    }
    function visibleAgents() {
      if (!hostFilter) return latestAgents;
      return latestAgents.filter(a => agentHostName(a) === hostFilter);
    }
    function category(agent) {
      if (!agent.tracked || agent.state === 'SHELL') return 'shell';
      if (agent.state === 'WAIT') return 'wait';
      if (agent.state === 'RUNNING') return 'running';
      if (agent.pending) return 'review';
      return 'idle';
    }
    function cliBadge(cli) {
      const name = (cli || 'shell').toLowerCase();
      const icon = ({ claude: 'claude', codex: 'codex', agent: 'agent', cursor: 'agent', pi: 'pi' })[name];
      if (icon) {
        const label = name === 'cursor' ? 'cursor' : name;
        return `<span class="cli ${escapeHtml(icon)}" title="${escapeHtml(label)}"><img src="/icons/${escapeHtml(icon)}.svg" alt="${escapeHtml(label)}" loading="lazy" onerror="this.closest('.cli').classList.add('broken');this.remove()"></span>`;
      }
      const short = name.length > 6 ? name.slice(0, 5) + '…' : name;
      return `<span class="cli" title="${escapeHtml(name)}"><span class="cli-text">${escapeHtml(short)}</span></span>`;
    }
    function renderMarkdown(text) {
      const raw = String(text ?? '');
      if (!raw) return '';
      try {
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
          if (!renderMarkdown._ready) {
            marked.setOptions({ gfm: true, breaks: true });
            renderMarkdown._ready = true;
          }
          const html = marked.parse(raw, { async: false });
          return DOMPurify.sanitize(html, {
            USE_PROFILES: { html: true },
            ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto):|[^a-z]|[a-z+.-]+(?:[^a-z+.-:]|$))/i,
          });
        }
      } catch (_) { /* fall through */ }
      return escapeHtml(raw).replace(/\n/g, '<br>');
    }
    function previewHtml(preview) {
      const users = Array.isArray(preview?.users) ? preview.users.filter(Boolean) : [];
      const agentLine = preview?.agent || '';
      if (!users.length && !agentLine) return '';
      return `<div class="preview">${
        users.map(text => `<div class="preview-line user"><span class="who">you</span><span class="text md">${renderMarkdown(text)}</span></div>`).join('')
      }${agentLine ? `<div class="preview-line agent"><span class="who">agent</span><span class="text md">${renderMarkdown(agentLine)}</span></div>` : ''}</div>`;
    }
    function clipBranch(branch, limit = 36) {
      const text = String(branch || '');
      if (text.length <= limit) return text;
      return text.slice(0, Math.max(0, limit - 1)) + '…';
    }
    function envLineHtml(a) {
      const project = a.project || '';
      const repo = a.repo || '';
      const showRepo = repo && repo !== project;
      const branch = clipBranch(a.branch || '');
      const parts = [];
      if (showRepo) parts.push(`<span class="repo">${escapeHtml(repo)}</span>`);
      if (branch) parts.push(`<span class="branch">${escapeHtml(branch)}</span>`);
      if (a.dirty) parts.push('<span class="dirty">dirty</span>');
      return parts.length ? `<div class="env">${parts.join('')}</div>` : '';
    }
    function sheetEnvHtml(a) {
      const path = a.path || '';
      const branch = a.branch || '';
      if (!path && !branch) return '';
      const bits = [];
      if (branch) bits.push(`<span class="branch">${escapeHtml(branch)}</span>`);
      if (a.dirty) bits.push('<span class="dirty">dirty</span>');
      return `<div class="path">${escapeHtml(path || (a.repo || ''))}</div>` +
        (bits.length ? `<div class="row">${bits.join('')}</div>` : '');
    }
    function cardHtml(a, opts = {}) {
      const cat = category(a);
      const cli = (a.cli || a.agent || a.command || 'shell').toLowerCase();
      const hostName = agentHostName(a);
      const tone = hostTone(hostName);
      const host = `<span class="host tone-${tone}">${escapeHtml(hostName)}</span>`;
      const errorClass = a.severity === 'error' ? ' error' : '';
      const newestClass = opts.newest ? ' newest' : '';
      const selected = agentKey(a) === selectedKey ? ' selected' : '';
      const selectable = a.tracked ? ' tabindex="0" role="button"' : '';
      return `<article class="card ${cat}${newestClass}${errorClass}${selected}" data-key="${escapeHtml(agentKey(a))}"${selectable}>
        <div class="row1">
          <div class="title">
            <span class="emoji" aria-hidden="true">${a.emoji}</span>
            <span class="project">${escapeHtml(a.project || a.window || a.pane)}</span>
            ${cliBadge(cli)}
            ${host}
          </div>
          <div class="age">${escapeHtml(a.age)}</div>
        </div>
        ${envLineHtml(a)}
        <div class="reason">${escapeHtml(a.reason)}</div>
        ${previewHtml(a.preview)}
      </article>`;
    }
    function stopListening() {
      if (recognition && listening) {
        try { recognition.stop(); } catch (_) {}
      }
      listening = false;
      document.getElementById('sheet-mic').classList.remove('listening');
      document.getElementById('voice-hint').hidden = true;
    }
    let killArmedUntil = 0;
    function resetKillArm() {
      killArmedUntil = 0;
      const btn = document.getElementById('sheet-kill');
      if (btn) {
        btn.classList.remove('armed');
        btn.disabled = false;
        btn.setAttribute('aria-label', '關閉 pane');
        btn.title = '關閉 pane（需按兩次）';
      }
    }
    function closeSheet() {
      stopListening();
      resetKillArm();
      sheetOpen = false;
      selectedKey = '';
      sheetPreviewKey = '';
      sheetPreviewFull = false;
      sheetPreviewUpdated = 0;
      sheetPreviewToken += 1;
      document.getElementById('sheet-root').hidden = true;
      document.body.classList.remove('sheet-open');
      document.getElementById('sheet-text').value = '';
      document.getElementById('sheet-status').textContent = '';
      document.getElementById('sheet-status').className = 'sheet-feedback';
      document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
    }
    function emptyPreviewHtml() {
      return '<div class="preview-line agent"><span class="who">—</span><span class="text">尚無對話預覽</span></div>';
    }
    function fillSheetMeta(agent) {
      document.getElementById('sheet-title').textContent =
        `${agent.emoji || ''} ${agent.project || agent.window || agent.pane}`.trim();
      document.getElementById('sheet-target').textContent =
        `${agent.host || 'local'} ${agent.pane} / ${agent.cli || agent.agent} / ${agent.session}`;
      const env = document.getElementById('sheet-env');
      const envHtml = sheetEnvHtml(agent);
      env.hidden = !envHtml;
      env.innerHTML = envHtml;
      document.getElementById('sheet-reason').textContent = agent.reason || '';
    }
    async function loadSheetPreview(agent) {
      const key = agentKey(agent);
      const box = document.getElementById('sheet-preview');
      if (sheetPreviewKey !== key || !sheetPreviewFull) {
        box.innerHTML = previewHtml(agent.preview) || emptyPreviewHtml();
        sheetPreviewKey = key;
        sheetPreviewFull = false;
        sheetPreviewUpdated = 0;
      }
      const token = ++sheetPreviewToken;
      try {
        const res = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid }),
        });
        const data = await res.json();
        if (token !== sheetPreviewToken || selectedKey !== key) return;
        if (!res.ok || !data.ok) {
          const status = document.getElementById('sheet-status');
          if (status && !status.textContent) {
            status.className = 'sheet-feedback bad';
            status.textContent = (data && data.error) ? ('預覽：' + data.error) : ('預覽載入失敗 HTTP ' + res.status);
          }
          return;
        }
        box.innerHTML = previewHtml(data.preview) || emptyPreviewHtml();
        sheetPreviewFull = true;
        sheetPreviewKey = key;
        sheetPreviewUpdated = agent.updated || 0;
      } catch (e) {
        const status = document.getElementById('sheet-status');
        if (status && !status.textContent) {
          status.className = 'sheet-feedback bad';
          status.textContent = '預覽載入失敗';
        }
      }
    }
    function fillSheet(agent, { refreshPreview = true } = {}) {
      fillSheetMeta(agent);
      if (refreshPreview) loadSheetPreview(agent);
    }
    function openSheet(agent) {
      selectedKey = agentKey(agent);
      sheetOpen = true;
      sheetPreviewKey = '';
      sheetPreviewFull = false;
      sheetPreviewUpdated = 0;
      fillSheet(agent, { refreshPreview: true });
      document.getElementById('sheet-status').textContent = '';
      document.getElementById('sheet-status').className = 'sheet-feedback';
      document.getElementById('sheet-root').hidden = false;
      document.body.classList.add('sheet-open');
      document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
      const card = document.querySelector(`.card[data-key="${CSS.escape(selectedKey)}"]`);
      if (card) card.classList.add('selected');
      const mic = document.getElementById('sheet-mic');
      if (SpeechAPI) {
        mic.disabled = false;
        mic.title = '語音輸入';
      } else {
        mic.disabled = true;
        mic.title = '此瀏覽器不支援語音辨識';
        document.getElementById('voice-hint').hidden = false;
        document.getElementById('voice-hint').textContent = '此瀏覽器不支援語音辨識，可用鍵盤輸入。';
      }
      requestAnimationFrame(() => document.getElementById('sheet-text').focus());
    }
    function syncSheetFromData() {
      if (!sheetOpen || !selectedKey) return;
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      if (!agent) {
        closeSheet();
        return;
      }
      fillSheetMeta(agent);
      if (!sheetPreviewFull || (agent.updated || 0) !== sheetPreviewUpdated) {
        loadSheetPreview(agent);
      }
    }
    function renderSummary(counts) {
      document.getElementById('summary').innerHTML = [
        ['wait', '🙋', counts.wait || 0, '等待'],
        ['review', '👀', counts.review || 0, '待看'],
        ['running', '🏃', counts.running || 0, '進行中'],
        ['idle', '💤', counts.idle || 0, '閒置'],
      ].map(([key, e, n, l]) => {
        const disabled = n === 0 ? ' disabled' : '';
        const active = activeGroup === key ? ' active' : '';
        const title = n === 0 ? '目前沒有此狀態' : `跳到${l}`;
        return `<button type="button" class="stat${active}" data-group="${key}"${disabled} title="${title}" aria-label="${title}"><div class="n">${e} ${n}</div><div class="l">${l}</div></button>`;
      }).join('');
    }
    function visibleSummaryCounts(agents) {
      const counts = { wait: 0, review: 0, running: 0, idle: 0 };
      for (const a of agents) {
        const key = category(a);
        if (key in counts) counts[key] += 1;
      }
      return counts;
    }
    function render(data) {
      latestPayload = data;
      const s = data.summary || {};
      const hosts = data.hosts || [];
      latestHosts = hosts;
      if (hostFilter && !hosts.some(h => h.name === hostFilter)) hostFilter = '';
      const okHosts = hosts.filter(h => h.ok).length;
      const filterNote = hostFilter ? `，篩選 ${hostFilter}` : '';
      document.getElementById('meta').textContent =
        `追蹤 ${s.tracked || 0}，其他 ${s.untracked || 0}` +
        (hosts.length ? `，主機 ${okHosts}/${hosts.length}` : '') +
        filterNote +
        '，約 2 秒更新';
      const hostButtons = [];
      if (hosts.length > 1) {
        hostButtons.push(
          `<button type="button" class="host-pill all${hostFilter ? '' : ' active'}" data-host="" aria-pressed="${hostFilter ? 'false' : 'true'}">全部</button>`
        );
      }
      for (const row of hosts) {
        const tone = hostTone(row.name);
        const active = hostFilter === row.name ? ' active' : '';
        const offline = row.ok ? '' : ' bad';
        const label = escapeHtml(row.name) + (row.ok ? '' : ' offline');
        hostButtons.push(
          `<button type="button" class="host-pill tone-${tone}${offline}${active}" data-host="${escapeHtml(row.name)}" title="${escapeHtml(row.error || row.url || row.source || '')}" aria-pressed="${hostFilter === row.name ? 'true' : 'false'}">${label}</button>`
        );
      }
      document.getElementById('hosts').innerHTML = hostButtons.join('');
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const err = document.getElementById('error');
      err.hidden = true;
      latestAgents = data.agents || [];
      const shown = visibleAgents();
      renderSummary(visibleSummaryCounts(shown));
      if (!latestAgents.length) {
        list.innerHTML = '';
        empty.hidden = false;
        empty.textContent = hosts.some(h => !h.ok)
          ? '尚無資料。檢查 peers 是否在線，或本機 tmux／hooks。'
          : '沒有 live pane。確認工作機上的 tmux 有在跑。';
        if (sheetOpen) closeSheet();
        return;
      }
      if (!shown.length) {
        list.innerHTML = '';
        empty.hidden = false;
        empty.textContent = `沒有 ${hostFilter} 的 pane。點「全部」或其它主機。`;
        if (sheetOpen) closeSheet();
        return;
      }
      empty.hidden = true;
      const grouped = Object.fromEntries(SECTIONS.map(([key]) => [key, []]));
      for (const a of shown) grouped[category(a)].push(a);
      for (const key of Object.keys(grouped)) {
        grouped[key].sort((a, b) => (b.updated || 0) - (a.updated || 0));
      }
      list.innerHTML = SECTIONS.map(([key, title]) => {
        const rows = grouped[key];
        if (!rows.length) return '';
        return `<div class="section" id="group-${key}" data-group="${key}"><span>${SECTION_EMOJI[key]} ${title}</span><span class="count">${rows.length}</span></div>` +
          rows.map((a, i) => cardHtml(a, { newest: key === 'review' && i === 0 })).join('');
      }).join('');
      syncSheetFromData();
    }
    function jumpToGroup(key) {
      const el = document.getElementById(`group-${key}`);
      if (!el) return;
      activeGroup = key;
      document.querySelectorAll('.stat[data-group]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.group === key);
      });
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function setupSpeech() {
      if (!SpeechAPI) return;
      recognition = new SpeechAPI();
      recognition.lang = (navigator.language || 'zh-TW').startsWith('zh') ? 'zh-TW' : (navigator.language || 'en-US');
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.onstart = () => {
        listening = true;
        document.getElementById('sheet-mic').classList.add('listening');
        document.getElementById('voice-hint').hidden = false;
        document.getElementById('voice-hint').textContent = '聆聽中…再點麥克風結束';
      };
      recognition.onend = () => {
        listening = false;
        document.getElementById('sheet-mic').classList.remove('listening');
        document.getElementById('voice-hint').hidden = true;
      };
      recognition.onerror = (event) => {
        listening = false;
        document.getElementById('sheet-mic').classList.remove('listening');
        const status = document.getElementById('sheet-status');
        status.className = 'sheet-feedback bad';
        status.textContent = event.error === 'not-allowed' ? '需要麥克風權限' : ('語音錯誤: ' + event.error);
        document.getElementById('voice-hint').hidden = true;
      };
      recognition.onresult = (event) => {
        let interim = '';
        let finalText = '';
        for (let i = 0; i < event.results.length; i++) {
          const piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += piece;
          else interim += piece;
        }
        const box = document.getElementById('sheet-text');
        const joined = (speechBase + (finalText || interim)).replace(/\s+/g, ' ').trimStart();
        box.value = joined;
        if (finalText) speechBase = (speechBase + finalText).replace(/\s+/g, ' ');
        if (!speechBase.endsWith(' ') && speechBase) speechBase += ' ';
      };
    }
    document.getElementById('summary').addEventListener('click', (event) => {
      const btn = event.target.closest('.stat[data-group]');
      if (!btn || btn.disabled) return;
      jumpToGroup(btn.dataset.group);
    });
    document.getElementById('hosts').addEventListener('click', (event) => {
      const pill = event.target.closest('.host-pill[data-host]');
      if (!pill) return;
      const name = pill.dataset.host || '';
      hostFilter = (!name || hostFilter === name) ? '' : name;
      if (latestPayload) render(latestPayload);
    });
    document.getElementById('list').addEventListener('click', (event) => {
      const card = event.target.closest('.card[data-key]');
      if (!card) return;
      const agent = latestAgents.find(a => agentKey(a) === card.dataset.key);
      if (!agent || !agent.tracked) return;
      openSheet(agent);
    });
    document.getElementById('sheet-scrim').addEventListener('click', closeSheet);
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && sheetOpen) closeSheet();
    });
    document.getElementById('sheet-mic').addEventListener('click', () => {
      if (!recognition) return;
      if (listening) {
        stopListening();
        return;
      }
      speechBase = document.getElementById('sheet-text').value;
      if (speechBase && !speechBase.endsWith(' ')) speechBase += ' ';
      try {
        recognition.start();
      } catch (e) {
        document.getElementById('sheet-status').className = 'sheet-feedback bad';
        document.getElementById('sheet-status').textContent = e.message || '無法開始語音';
      }
    });
    document.getElementById('sheet-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      stopListening();
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      const status = document.getElementById('sheet-status');
      const button = document.getElementById('sheet-send');
      const text = document.getElementById('sheet-text').value;
      if (!agent) return;
      button.disabled = true;
      status.className = 'sheet-feedback';
      status.textContent = '送出中…';
      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid, text, submit: true }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        status.className = 'sheet-feedback ok';
        status.textContent = '已貼上';
        document.getElementById('sheet-text').value = '';
        setTimeout(closeSheet, 280);
      } catch (e) {
        status.className = 'sheet-feedback bad';
        status.textContent = e.message;
      } finally {
        button.disabled = false;
      }
    });
    document.getElementById('sheet-kill').addEventListener('click', async () => {
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      const status = document.getElementById('sheet-status');
      const btn = document.getElementById('sheet-kill');
      if (!agent) return;
      const now = Date.now();
      if (now > killArmedUntil) {
        killArmedUntil = now + 5000;
        btn.classList.add('armed');
        btn.setAttribute('aria-label', '再按一次確認關閉');
        btn.title = '5 秒內再按一次確認關閉';
        status.className = 'sheet-feedback';
        status.textContent = '再按一次確認關閉';
        return;
      }
      btn.disabled = true;
      status.className = 'sheet-feedback';
      status.textContent = '關閉中…';
      try {
        const res = await fetch('/api/kill', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        status.className = 'sheet-feedback ok';
        status.textContent = '已關閉 pane';
        setTimeout(() => { closeSheet(); refresh(); }, 320);
      } catch (e) {
        status.className = 'sheet-feedback bad';
        status.textContent = e.message;
        resetKillArm();
        btn.disabled = false;
      }
    });
    async function refresh() {
      const clock = document.getElementById('clock');
      try {
        const res = await fetch('/api/fleet', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'payload error');
        render(data);
        clock.textContent = 'live';
        clock.dataset.state = 'live';
      } catch (e) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = '無法讀取狀態：' + e.message;
        clock.textContent = 'offline';
        clock.dataset.state = 'offline';
      }
    }
    setupSpeech();
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
