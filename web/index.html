<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="tmux attention — multi-host agent status">
  <title>Attention</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@450;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --bg-elevated: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-fg: #f8fafc;
      --wait: #c2410c;
      --review: #0369a1;
      --running: #15803d;
      --idle: #71717a;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --radius: 8px;
      --font: "Outfit", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --max: 42rem;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --header-bg: color-mix(in srgb, var(--bg) 86%, transparent);
      --sheet-bg: #ffffff;
      --scrim: rgb(24 24 27 / 0.42);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0e;
        --bg-elevated: #141417;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --line: #27272a;
        --card: #18181b;
        --accent: #2dd4bf;
        --accent-fg: #042f2e;
        --wait: #fb923c;
        --review: #38bdf8;
        --running: #4ade80;
        --idle: #a1a1aa;
        --danger: #f87171;
        --danger-bg: #450a0a;
        --header-bg: color-mix(in srgb, var(--bg) 88%, transparent);
        --sheet-bg: #18181b;
        --scrim: rgb(0 0 0 / 0.55);
      }
    }
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      font: 15px/1.45 var(--font);
      color: var(--fg);
      background: var(--bg);
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    body.sheet-open { overflow: hidden; }
    .wrap {
      width: min(100%, var(--max));
      margin: 0 auto;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: -4px -8px 0;
      padding: 10px 8px 12px;
      background: var(--header-bg);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--line);
    }
    .refresh-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms var(--ease);
      background: transparent;
    }
    header.is-refreshing .refresh-bar {
      opacity: 1;
    }
    .refresh-bar::after {
      content: "";
      display: block;
      height: 100%;
      width: 36%;
      border-radius: 1px;
      background: color-mix(in srgb, var(--running) 85%, var(--accent));
      animation: refresh-slide 1.05s var(--ease) infinite;
    }
    @keyframes refresh-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .live[data-state="updating"]::before { animation: none; }
      .refresh-bar::after {
        animation: none;
        width: 100%;
        opacity: 0.55;
        transform: none;
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      header {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: var(--card);
      }
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      padding: 5px 9px 5px 8px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--running) 35%, var(--line));
      color: var(--running);
      background: color-mix(in srgb, var(--running) 14%, var(--card));
    }
    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
    }
    .live[data-state="loading"] {
      color: var(--muted);
      border-color: var(--line);
      background: color-mix(in srgb, var(--line) 35%, var(--card));
    }
    .live[data-state="updating"] {
      color: color-mix(in srgb, var(--running) 72%, var(--muted));
      border-color: color-mix(in srgb, var(--running) 28%, var(--line));
      background: color-mix(in srgb, var(--running) 10%, var(--card));
    }
    .live[data-state="updating"]::before {
      animation: live-pulse 1.1s ease-in-out infinite;
    }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent); }
      50% { opacity: 0.45; box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 10%, transparent); }
    }
    .live[data-state="offline"] {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
      background: color-mix(in srgb, var(--danger) 12%, var(--card));
    }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 4%, transparent);
    }
    .stat {
      appearance: none;
      display: block;
      width: 100%;
      margin: 0;
      border: 0;
      background: var(--card);
      padding: 16px 8px 14px;
      text-align: center;
      color: inherit;
      font: inherit;
      cursor: pointer;
      min-height: 4.5rem;
    }
    .stat:disabled {
      opacity: 0.42;
      cursor: default;
    }
    .stat:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      z-index: 1;
      position: relative;
    }
    .stat.active {
      background: color-mix(in srgb, var(--accent) 12%, var(--card));
    }
    .stat .n {
      font-family: var(--mono);
      font-size: clamp(1rem, 5vw, 1.45rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      line-height: 1.15;
      white-space: nowrap;
    }
    .stat .l {
      margin-top: 6px;
      min-height: 1.45em;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .hosts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }
    .host-pill {
      appearance: none;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      cursor: pointer;
      line-height: 1.2;
      color: var(--host-fg, var(--muted));
      background: var(--host-bg, var(--bg-elevated));
      border-color: var(--host-bd, var(--line));
    }
    .host-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .host-pill.all {
      --host-fg: var(--muted);
      --host-bg: var(--bg-elevated);
      --host-bd: var(--line);
      font-weight: 500;
    }
    .host-pill.tone-0 { --host-fg: #0f766e; --host-bg: #ccfbf1; --host-bd: #5eead4; }
    .host-pill.tone-1 { --host-fg: #b45309; --host-bg: #ffedd5; --host-bd: #fdba74; }
    .host-pill.tone-2 { --host-fg: #1d4ed8; --host-bg: #dbeafe; --host-bd: #93c5fd; }
    .host-pill.tone-3 { --host-fg: #be123c; --host-bg: #ffe4e6; --host-bd: #fda4af; }
    .host-pill.tone-4 { --host-fg: #3f6212; --host-bg: #ecfccb; --host-bd: #bef264; }
    .host-pill.tone-5 { --host-fg: #0e7490; --host-bg: #cffafe; --host-bd: #67e8f9; }
    .host-pill.tone-6 { --host-fg: #a16207; --host-bg: #fef9c3; --host-bd: #fde047; }
    .host-pill.tone-7 { --host-fg: #9a3412; --host-bg: #ffedd5; --host-bd: #fb923c; }
    .host-pill.bad {
      opacity: 0.72;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }
    .host-pill.active {
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--host-fg, var(--accent)) 55%, transparent);
      opacity: 1;
    }
    /* Online but idle: mute colors only — avoid filter (breaks flex wrap / overflow). */
    .host-pill.empty:not(.active):not(.bad) {
      --host-fg: var(--muted);
      --host-bg: color-mix(in srgb, var(--line) 42%, var(--card));
      --host-bd: var(--line);
      font-weight: 500;
      box-shadow: none;
      opacity: 0.72;
    }
    .host-pill.empty:not(.active):not(.bad):hover,
    .host-pill.empty:not(.active):not(.bad):focus-visible {
      opacity: 0.92;
      --host-bd: color-mix(in srgb, var(--muted) 35%, var(--line));
    }
    .host-pill.dim {
      opacity: 0.4;
      box-shadow: none;
    }
    .host-pill.dim:hover,
    .host-pill.dim:focus-visible {
      opacity: 0.7;
    }
    .host-pill .count {
      font-weight: 500;
      opacity: 0.88;
      margin-left: 0.15em;
    }
    @media (prefers-color-scheme: dark) {
      .host-pill.tone-0 { --host-fg: #5eead4; --host-bg: #042f2e; --host-bd: #0f766e; }
      .host-pill.tone-1 { --host-fg: #fdba74; --host-bg: #431407; --host-bd: #c2410c; }
      .host-pill.tone-2 { --host-fg: #93c5fd; --host-bg: #172554; --host-bd: #1d4ed8; }
      .host-pill.tone-3 { --host-fg: #fda4af; --host-bg: #4c0519; --host-bd: #be123c; }
      .host-pill.tone-4 { --host-fg: #bef264; --host-bg: #1a2e05; --host-bd: #4d7c0f; }
      .host-pill.tone-5 { --host-fg: #67e8f9; --host-bg: #083344; --host-bd: #0e7490; }
      .host-pill.tone-6 { --host-fg: #fde047; --host-bg: #422006; --host-bd: #a16207; }
      .host-pill.tone-7 { --host-fg: #fb923c; --host-bg: #431407; --host-bd: #c2410c; }
    }
    main.list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding-bottom: 8px;
    }
    .section {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 12px 0 2px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      scroll-margin-top: 7.5rem;
    }
    .section:first-child { margin-top: 4px; }
    .section .count {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.72rem;
      opacity: 0.9;
    }
    .section[data-group="review"] {
      color: var(--review);
    }
    .section[data-group="review"] .count {
      padding: 1px 6px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--review) 16%, transparent);
      opacity: 1;
    }
    .review-state { display: inline-flex; align-items: center; gap: 4px; font-size: 0.68rem; font-weight: 500; color: var(--muted); }
    .review-state.unread { color: var(--review); font-weight: 600; }
    .review-state.unread::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px 12px 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--idle);
      transition: border-color 160ms var(--ease), background 160ms var(--ease);
      cursor: pointer;
    }
    .card.shell { cursor: default; }
    @media (prefers-reduced-motion: no-preference) {
      .card { transition: border-color 160ms var(--ease), background 160ms var(--ease), transform 140ms var(--ease); }
      .card:active { transform: scale(0.985); }
    }
    .card.selected {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 6%, var(--card));
    }
    .card.wait { border-left-color: var(--wait); }
    .card.review.unread {
      border-left-color: var(--review);
      background: color-mix(in srgb, var(--review) 7%, var(--card));
    }
    .card.review.unread.newest {
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--review) 40%, transparent);
      background: color-mix(in srgb, var(--review) 11%, var(--card));
    }
    .card.running { border-left-color: var(--running); }
    .card.idle { border-left-color: var(--idle); }
    .card.shell {
      border-left-color: color-mix(in srgb, var(--muted) 40%, var(--line));
      background: color-mix(in srgb, var(--card) 70%, var(--bg));
    }
    .card.error {
      border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
      border-left-color: var(--danger);
      background: var(--danger-bg);
    }
    .row1 {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      justify-content: space-between;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      font-weight: 600;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      min-width: 0;
    }
    .emoji { font-size: 1.05rem; line-height: 1; }
    .project { min-width: 0; overflow-wrap: anywhere; }
    .age {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
      padding-top: 3px;
    }
    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .env {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      min-width: 0;
    }
    .env .repo { color: color-mix(in srgb, var(--fg) 72%, var(--muted)); }
    .env .branch { color: var(--muted); overflow-wrap: anywhere; }
    .env .dirty {
      color: var(--wait);
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sheet-env {
      margin: 0 0 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--bg);
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.45;
      color: var(--muted);
    }
    .sheet-env .path {
      color: color-mix(in srgb, var(--fg) 78%, var(--muted));
      overflow-wrap: anywhere;
    }
    .sheet-env .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-top: 4px;
      align-items: baseline;
    }
    .sheet-env .branch { color: var(--muted); }
    .sheet-env .dirty { color: var(--wait); }
    .reason {
      margin-top: 7px;
      font-size: 0.88rem;
      color: color-mix(in srgb, var(--fg) 82%, var(--muted));
      text-wrap: pretty;
    }
    .card.error .reason { color: var(--danger); font-weight: 500; }
    .preview {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .preview-line {
      display: grid;
      grid-template-columns: 2.4rem 1fr;
      gap: 8px;
      align-items: start;
      font-size: 0.84rem;
      line-height: 1.4;
    }
    .preview-line .who {
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--muted);
      padding-top: 3px;
    }
    .preview-line.user .text {
      color: var(--fg);
      font-weight: 500;
      text-wrap: pretty;
    }
    .preview-line.user:last-of-type .text { font-weight: 600; }
    .preview-line.agent {
      margin-top: 3px;
      padding-top: 6px;
      border-top: 1px dashed var(--line);
    }
    .preview-line.agent .text {
      color: var(--muted);
      text-wrap: pretty;
    }
    .card .preview-line .text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    .card .preview-line .text.md {
      display: block;
      -webkit-line-clamp: unset;
      -webkit-box-orient: unset;
      max-height: 4.9em;
      overflow: hidden;
    }
    .card.review.unread .preview-line.agent .text {
      -webkit-line-clamp: 4;
      color: color-mix(in srgb, var(--fg) 78%, var(--muted));
    }
    .card.review.unread .preview-line.agent .text.md {
      -webkit-line-clamp: unset;
      max-height: 6.6em;
      color: color-mix(in srgb, var(--fg) 78%, var(--muted));
    }
    .sheet-preview .preview-line .text {
      overflow-wrap: anywhere;
    }
    .sheet-preview .preview-line .text.md {
      max-height: none;
      overflow: visible;
    }
    .preview-line .text.md {
      font-size: inherit;
      line-height: 1.45;
    }
    .preview-line .text.md > :first-child { margin-top: 0; }
    .preview-line .text.md > :last-child { margin-bottom: 0; }
    .preview-line .text.md p,
    .preview-line .text.md ul,
    .preview-line .text.md ol,
    .preview-line .text.md pre,
    .preview-line .text.md blockquote,
    .preview-line .text.md table {
      margin: 0.35em 0;
    }
    .preview-line .text.md h1,
    .preview-line .text.md h2,
    .preview-line .text.md h3,
    .preview-line .text.md h4 {
      margin: 0.55em 0 0.25em;
      font-size: 1em;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1.3;
    }
    .preview-line .text.md h1 { font-size: 1.12em; }
    .preview-line .text.md h2 { font-size: 1.06em; }
    .preview-line .text.md ul,
    .preview-line .text.md ol {
      padding-left: 1.25em;
    }
    .preview-line .text.md li { margin: 0.15em 0; }
    .preview-line .text.md li + li { margin-top: 0.1em; }
    .preview-line .text.md code {
      font-family: var(--mono);
      font-size: 0.86em;
      background: color-mix(in srgb, var(--bg) 70%, var(--line));
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    .preview-line .text.md pre {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .preview-line .text.md pre code {
      background: transparent;
      padding: 0;
      font-size: 0.8em;
      line-height: 1.4;
    }
    .preview-line .text.md blockquote {
      border-left: 3px solid var(--line);
      padding-left: 0.75em;
      color: var(--muted);
    }
    .preview-line .text.md a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .preview-line .text.md table {
      border-collapse: collapse;
      font-size: 0.9em;
      width: 100%;
    }
    .preview-line .text.md th,
    .preview-line .text.md td {
      border: 1px solid var(--line);
      padding: 4px 8px;
      text-align: left;
    }
    .preview-line .text.md th {
      background: var(--bg);
      font-weight: 600;
    }
    .preview-line .text.md hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 0.6em 0;
    }
    .preview-line .text.md strong { font-weight: 650; color: var(--fg); }
    .preview-line.agent .text.md strong { color: color-mix(in srgb, var(--fg) 88%, var(--muted)); }
    .empty, .banner-error {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      padding: 24px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .banner-error {

  <script>
    const SECTIONS = [
      ['wait', '等待回覆'],
      ['review', '待看'],
      ['idle', '閒置'],
      ['running', '進行中'],
      ['shell', '其他 pane'],
    ];
    const SECTION_EMOJI = { wait: '🙋', review: '👀', running: '🏃', idle: '💤', shell: '💻' };
    const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    let selectedKey = '';
    let latestAgents = [];
    let latestHosts = [];
    let latestPayload = null;
    let hostFilters = new Set(); // empty = show all hosts
    let activeGroup = '';
    let sheetOpen = false;
    let sheetPreviewKey = '';
    let sheetPreviewFull = false;
    let sheetPreviewUpdated = 0;
    let sheetPreviewRevision = 0;
    let sheetPreviewToken = 0;
    const acknowledgedVersions = new Map();
    const acknowledgementsInFlight = new Map();
    let recognition = null;
    let listening = false;
    let speechBase = '';
    let micPermissionGranted = false;
    let micRequestInFlight = false;
    let micPromptAttempted = false;
    const STALE_HOST_TTL_MS = 35000;
    const lastGoodByHost = new Map();

    function isMicSecureContext() {
      if (typeof window !== 'undefined' && window.isSecureContext === false) return false;
      const loc = (typeof window !== 'undefined' && window.location) || (typeof location !== 'undefined' ? location : null);
      if (loc && loc.protocol === 'http:') {
        const host = String(loc.hostname || '').toLowerCase();
        if (host && host !== 'localhost' && host !== '127.0.0.1' && host !== '::1' && host !== '[::1]' && !host.endsWith('.localhost')) {
          return false;
        }
      }
      return true;
    }

    function micBlockedMessage() {
      if (!isMicSecureContext()) {
        return '瀏覽器限制：非本機 HTTP 無法要求麥克風權限，請改用 HTTPS（如 tailscale serve）、localhost 或系統聽寫';
      }
      return '麥克風權限已被瀏覽器封鎖，請點網址列左側圖示允許麥克風後重試';
    }

    function getNavigator() {
      if (typeof window !== 'undefined' && window.navigator) return window.navigator;
      if (typeof navigator !== 'undefined' && navigator) return navigator;
      return null;
    }

    async function requestMicPermission() {
      if (!isMicSecureContext()) {
        const err = new Error(micBlockedMessage());
        err.code = 'insecure-context';
        throw err;
      }
      if (micPermissionGranted) return true;
      const nav = getNavigator();
      if (nav && nav.mediaDevices && typeof nav.mediaDevices.getUserMedia === 'function') {
        micPromptAttempted = true;
        const status = document.getElementById('sheet-status');
        status.className = 'sheet-feedback';
        status.textContent = '正在要求麥克風權限…';
        const stream = await nav.mediaDevices.getUserMedia({ audio: true });
        if (stream && typeof stream.getTracks === 'function') {
          stream.getTracks().forEach(track => {
            try { track.stop(); } catch (_) {}
          });
        }
        micPermissionGranted = true;
        if (status.textContent === '正在要求麥克風權限…') status.textContent = '';
      }
      return true;
    }

    function agentKey(a) {
      return [a.host || '', a.pane || '', a.pid || ''].join('|');
    }
    function hostTone(name) {
      const text = String(name || '');
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return Math.abs(hash) % 8;
    }
    function agentHostName(a) {
      return a.host || latestHosts.find(h => h.source === 'local')?.name || 'local';
    }
    function visibleAgents() {
      if (!hostFilters.size) return latestAgents;
      return latestAgents.filter(a => hostFilters.has(agentHostName(a)));
    }
    function hostSessionCounts(agents) {
      // Count tracked agent sessions only — bare shell panes are not sessions.
      const counts = Object.create(null);
      for (const a of agents) {
        if (category(a) === 'shell') continue;
        const name = agentHostName(a);
        counts[name] = (counts[name] || 0) + 1;
      }
      return counts;
    }
    function sortedHosts(hosts, sessionCounts) {
      return [...hosts].sort((a, b) => {
        const countDiff = (sessionCounts[b.name] || 0) - (sessionCounts[a.name] || 0);
        if (countDiff) return countDiff;
        if (!!a.ok !== !!b.ok) return a.ok ? -1 : 1;
        return String(a.name || '').localeCompare(String(b.name || ''), 'en');
      });
    }
    function category(agent) {
      if (agent.tracked === false || agent.state === 'SHELL') return 'shell';
      // The server owns classification; a just-confirmed version moves immediately.
      if (['wait', 'review', 'running', 'idle'].includes(agent.category)) {
        return agent.category === 'review' && !isUnread(agent) ? 'idle' : agent.category;
      }
      // Compatibility with older peers that do not publish a category yet.
      if (agent.state === 'WAIT') return 'wait';
      if (agent.state === 'RUNNING') return 'running';
      return isUnread(agent) ? 'review' : 'idle';
    }
    function isUnread(agent) {
      const reviewable = agent.state === 'WAIT' || (agent.needs_review ?? agent.unread ?? agent.pending ?? false);
      if (!reviewable) return false;
      const acknowledged = Math.max(Number(agent.acknowledged) || 0, acknowledgedVersions.get(agentKey(agent)) || 0);
      if (Number.isInteger(agent.revision) && agent.revision > 0) return agent.revision > acknowledged;
      return agent.unread ?? agent.pending ?? !agent.reviewed;
    }
    function renderMarkdown(text) {
      const raw = String(text ?? '');
      if (!raw) return '';
      try {
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
          if (!renderMarkdown._ready) {
            marked.setOptions({ gfm: true, breaks: true });
            renderMarkdown._ready = true;
          }
          const html = marked.parse(raw, { async: false });
          return DOMPurify.sanitize(html, {
            USE_PROFILES: { html: true },
            ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto):|[^a-z]|[a-z+.-]+(?:[^a-z+.-:]|$))/i,
          });
        }
      } catch (_) { /* fall through */ }
      return escapeHtml(raw).replace(/\n/g, '<br>');
    }
    function previewHtml(preview) {
      const users = Array.isArray(preview?.users) ? preview.users.filter(Boolean) : [];
      const agentLine = preview?.agent || '';
      if (!users.length && !agentLine) return '';
      return `<div class="preview">${
        users.map(text => `<div class="preview-line user"><span class="who">you</span><span class="text md">${renderMarkdown(text)}</span></div>`).join('')
      }${agentLine ? `<div class="preview-line agent"><span class="who">agent</span><span class="text md">${renderMarkdown(agentLine)}</span></div>` : ''}</div>`;
    }
    function clipBranch(branch, limit = 36) {
      const text = String(branch || '');
      if (text.length <= limit) return text;
      return text.slice(0, Math.max(0, limit - 1)) + '…';
    }
    function envLineHtml(a) {
      const project = a.project || '';
      const repo = a.repo || '';
      const showRepo = repo && repo !== project;
      const branch = clipBranch(a.branch || '');
      const parts = [];
      if (showRepo) parts.push(`<span class="repo">${escapeHtml(repo)}</span>`);
      if (branch) parts.push(`<span class="branch">${escapeHtml(branch)}</span>`);
      if (a.dirty) parts.push('<span class="dirty">dirty</span>');
      return parts.length ? `<div class="env">${parts.join('')}</div>` : '';
    }
    function sheetEnvHtml(a) {
      const path = a.path || '';
      const branch = a.branch || '';
      if (!path && !branch) return '';
      const bits = [];
      if (branch) bits.push(`<span class="branch">${escapeHtml(branch)}</span>`);
      if (a.dirty) bits.push('<span class="dirty">dirty</span>');
      return `<div class="path">${escapeHtml(path || (a.repo || ''))}</div>` +
        (bits.length ? `<div class="row">${bits.join('')}</div>` : '');
    }
    function attentionDisplay(a) {
      const cat = category(a);
      const reviewed = cat === 'idle' && (a.needs_review || a.reviewed) && !isUnread(a);
      const emoji = SECTION_EMOJI[cat];
      const reason = reviewed ? String(a.reason || '').replace('尚未查看', '已查看') : a.reason;
      return { cat, reviewed, emoji, reason };
    }
    function cardHtml(a, opts = {}) {
      const { cat, reviewed, emoji, reason } = attentionDisplay(a);
      const errorClass = a.severity === 'error' ? ' error' : '';
      const newestClass = opts.newest ? ' newest' : '';
      const reviewClass = cat === 'review' ? ' unread' : '';
      const reviewState = cat === 'review' ? '<span class="review-state unread">未看</span>' :
        reviewed ? '<span class="review-state">已看</span>' : '';
      const selected = agentKey(a) === selectedKey ? ' selected' : '';
      const selectable = a.tracked ? ' tabindex="0" role="button"' : '';
      return `<article class="card ${cat}${reviewClass}${newestClass}${errorClass}${selected}" data-key="${escapeHtml(agentKey(a))}"${selectable}>
        <div class="row1">
          <div class="title">
            <span class="emoji" aria-hidden="true">${emoji}</span>
            <span class="project">${escapeHtml(a.project || a.window || '未命名專案')}</span>
            ${reviewState}
          </div>
          <div class="age">${escapeHtml(a.age)}</div>
        </div>
        ${envLineHtml(a)}
        <div class="reason">${escapeHtml(reason)}</div>
        ${previewHtml(a.preview)}
      </article>`;
    }
    function stopListening() {
      if (recognition && listening) {
        try { recognition.stop(); } catch (_) {}
      }
      listening = false;
      document.getElementById('sheet-mic').classList.remove('listening');
      document.getElementById('voice-hint').hidden = true;
    }
    let killArmedUntil = 0;
    function resetKillArm() {
      killArmedUntil = 0;
      const btn = document.getElementById('sheet-kill');
      if (btn) {
        btn.classList.remove('armed');
        btn.disabled = false;
        btn.setAttribute('aria-label', '關閉 pane');
        btn.title = '關閉 pane（需按兩次）';
      }
    }
    function closeSheet() {
      stopListening();
      resetKillArm();
      sheetOpen = false;
      selectedKey = '';
      sheetPreviewKey = '';
      sheetPreviewFull = false;
      sheetPreviewUpdated = 0;
      sheetPreviewRevision = 0;
      sheetPreviewToken += 1;
      document.getElementById('sheet-root').hidden = true;
      document.body.classList.remove('sheet-open');
      document.getElementById('sheet-text').value = '';
      document.getElementById('sheet-status').textContent = '';
      document.getElementById('sheet-status').className = 'sheet-feedback';
      document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
      if (latestPayload) render(latestPayload);
    }
    function emptyPreviewHtml() {
      return '<div class="preview-line agent"><span class="who">—</span><span class="text">尚無對話預覽</span></div>';
    }
    function fillSheetMeta(agent) {
      const { emoji, reason } = attentionDisplay(agent);
      document.getElementById('sheet-title').textContent =
        `${emoji} ${agent.project || agent.window || '未命名專案'}`.trim();
      const env = document.getElementById('sheet-env');
      const envHtml = sheetEnvHtml(agent);
      env.hidden = !envHtml;
      env.innerHTML = envHtml;
      document.getElementById('sheet-reason').textContent = reason || '';
    }
    function confirmSheetMeta(agent, revision, token) {
      if (!sheetOpen || token !== sheetPreviewToken || selectedKey !== agentKey(agent) || sheetPreviewRevision !== revision) return;
      // Describe the viewed result, even if the latest fleet already has a newer turn.
      fillSheetMeta({ ...agent, state: 'IDLE', category: 'review', needs_review: true,
        revision, acknowledged: revision,
        reason: agent.state === 'IDLE' ? agent.reason : '已完成，已查看' });
    }
    async function loadSheetPreview(agent) {
      const key = agentKey(agent);
      const box = document.getElementById('sheet-preview');
      if (sheetPreviewKey !== key || !sheetPreviewFull) {
        box.innerHTML = previewHtml(agent.preview) || emptyPreviewHtml();
        sheetPreviewKey = key;
        sheetPreviewFull = false;
        sheetPreviewUpdated = 0;
      }
      const token = ++sheetPreviewToken;
      try {
        const res = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid }),
        });
        const data = await res.json();
        if (!sheetOpen || token !== sheetPreviewToken || selectedKey !== key) return;
        if (!res.ok || !data.ok) {
          const status = document.getElementById('sheet-status');
          if (status && !status.textContent) {
            status.className = 'sheet-feedback bad';
            status.textContent = (data && data.error) ? ('預覽：' + data.error) : ('預覽載入失敗 HTTP ' + res.status);
          }
          return;
        }
        box.innerHTML = previewHtml(data.preview) || emptyPreviewHtml();
        sheetPreviewFull = true;
        sheetPreviewKey = key;
        sheetPreviewUpdated = agent.updated || 0;
        sheetPreviewRevision = data.revision || 0;
        document.getElementById('sheet-refresh').textContent = '重新整理內容';
        if (data.viewable === false && category(agent) === 'review' && isUnread(agent)) {
          const status = document.getElementById('sheet-status');
          if (!status.textContent) {
            status.className = 'sheet-feedback';
            status.textContent = '最新內容尚未就緒，請稍後重新整理。';
          }
        }
        if (data.viewable && Number.isInteger(data.revision) && data.revision > 0) {
          // Let the rendered content reach the screen before acknowledging its exact version.
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          if (!sheetOpen || document.visibilityState === 'hidden' || token !== sheetPreviewToken || selectedKey !== key) return;
          await acknowledgePreview(agent, data.revision, token);
        }
      } catch (e) {
        if (!sheetOpen || token !== sheetPreviewToken || selectedKey !== key) return;
        const status = document.getElementById('sheet-status');
        if (status && !status.textContent) {
          status.className = 'sheet-feedback bad';
          status.textContent = '預覽載入失敗';
        }
      }
    }
    async function acknowledgePreview(agent, revision, token) {
      const key = agentKey(agent);
      const attempt = `${key}|${revision}`;
      const acknowledged = Math.max(Number(agent.acknowledged) || 0, acknowledgedVersions.get(key) || 0);
      if (revision <= acknowledged) {
        confirmSheetMeta(agent, revision, token);
        return;
      }
      const existing = acknowledgementsInFlight.get(attempt);
      if (existing) {
        if (await existing) confirmSheetMeta(agent, revision, token);
        else showAcknowledgementFailure(key, token);
        return;
      }
      let finishAttempt;
      let succeeded = false;
      const completion = new Promise(resolve => { finishAttempt = resolve; });
      acknowledgementsInFlight.set(attempt, completion);
      try {
        const res = await fetch('/api/ack', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid, revision }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || `HTTP ${res.status}`);
        acknowledgedVersions.set(key, Math.max(acknowledgedVersions.get(key) || 0, revision));
        succeeded = true;
        confirmSheetMeta(agent, revision, token);
        if (latestPayload) render(latestPayload);
      } catch (_) {
        showAcknowledgementFailure(key, token);
      } finally {
        acknowledgementsInFlight.delete(attempt);
        finishAttempt(succeeded);
      }
    }
    function showAcknowledgementFailure(key, token) {
      if (!sheetOpen || token !== sheetPreviewToken || selectedKey !== key) return;
      const status = document.getElementById('sheet-status');
      status.className = 'sheet-feedback bad';
      status.textContent = '已看狀態儲存失敗，請重新整理內容重試。';
    }
    function fillSheet(agent, { refreshPreview = true } = {}) {
      fillSheetMeta(agent);
      if (refreshPreview) loadSheetPreview(agent);
    }
    function openSheet(agent) {
      selectedKey = agentKey(agent);
      sheetOpen = true;
      sheetPreviewKey = '';
      sheetPreviewFull = false;
      sheetPreviewUpdated = 0;
      sheetPreviewRevision = 0;
      document.getElementById('sheet-refresh').textContent = '重新整理內容';
      fillSheet(agent, { refreshPreview: true });
      document.getElementById('sheet-status').textContent = '';
      document.getElementById('sheet-status').className = 'sheet-feedback';
      document.getElementById('sheet-root').hidden = false;
      document.body.classList.add('sheet-open');
      document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
      const card = document.querySelector(`.card[data-key="${CSS.escape(selectedKey)}"]`);
      if (card) card.classList.add('selected');
      const mic = document.getElementById('sheet-mic');
      if (SpeechAPI) {
        mic.disabled = false;
        mic.title = '語音輸入';
      } else {
        mic.disabled = true;
        mic.title = '此瀏覽器不支援語音辨識';
        document.getElementById('voice-hint').hidden = false;
        document.getElementById('voice-hint').textContent = '此瀏覽器不支援語音辨識，可用鍵盤輸入。';
      }
      requestAnimationFrame(() => document.getElementById('sheet-text').focus());
    }
    function syncSheetFromData() {
      if (!sheetOpen || !selectedKey) return;
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      if (!agent) {
        closeSheet();
        return;
      }
      // Polling updates the list, but does not replace content the user is reading.
      const newer = sheetPreviewFull && (sheetPreviewRevision
        ? (agent.revision || 0) > sheetPreviewRevision
        : (agent.updated || 0) > sheetPreviewUpdated);
      document.getElementById('sheet-refresh').textContent = newer ? '有新訊息 · 重新整理內容' : '重新整理內容';
    }
    function renderSummary(counts) {
      document.getElementById('summary').innerHTML = [
        ['wait', '🙋', counts.wait || 0, '等待'],
        ['review', '👀', counts.review || 0, '待看'],
        ['idle', '💤', counts.idle || 0, '閒置'],
        ['running', '🏃', counts.running || 0, '進行中'],
      ].map(([key, e, n, l]) => {
        const disabled = n === 0 ? ' disabled' : '';
        const active = activeGroup === key ? ' active' : '';
        const title = n === 0 ? '目前沒有此狀態' : `跳到${l}`;
        const ariaLabel = `${l} ${n}，${title}`;
        return `<button type="button" class="stat${active}" data-group="${key}"${disabled} title="${title}" aria-label="${ariaLabel}"><div class="n">${e} ${n}</div><div class="l">${l}</div></button>`;
      }).join('');
    }
    function visibleSummaryCounts(agents) {
      const counts = { wait: 0, review: 0, running: 0, idle: 0 };
      for (const a of agents) {
        const key = category(a);
        if (key in counts) counts[key] += 1;
      }
      return counts;
    }
    function render(data) {
      latestPayload = data;
      const s = data.summary || {};
      const hosts = (data.hosts || []).map(h => ({ ...h }));
      latestHosts = hosts;
      const now = (typeof performance !== 'undefined' && typeof performance.now === 'function') ? performance.now() : Date.now();
      const incomingAgents = data.agents || [];
      const byHost = new Map();
      for (const a of incomingAgents) {
        const hName = agentHostName(a);
        if (!byHost.has(hName)) byHost.set(hName, []);
        byHost.get(hName).push(a);
      }
      const mergedAgents = [...incomingAgents];
      for (const row of hosts) {
        const hostAgents = byHost.get(row.name) || [];
        if (row.ok) {
          lastGoodByHost.set(row.name, { ts: now, agents: hostAgents });
        } else if (hostAgents.length > 0) {
          row.stale = true;
          const prev = lastGoodByHost.get(row.name);
          const staleAgeMs = (Number(row.stale_age) || 0) * 1000;
          const originTs = prev ? prev.ts : (now - staleAgeMs);
          lastGoodByHost.set(row.name, { ts: originTs, agents: hostAgents });
        } else {
          const cached = lastGoodByHost.get(row.name);
          if (cached && cached.agents.length > 0 && now - cached.ts >= 0 && now - cached.ts <= STALE_HOST_TTL_MS) {
            mergedAgents.push(...cached.agents);
            row.stale = true;
          }
        }
      }
      latestAgents = mergedAgents;
      const known = new Set(hosts.map(h => h.name));
      for (const name of [...hostFilters]) {
        if (!known.has(name)) hostFilters.delete(name);
      }
      const filtered = hostFilters.size > 0;
      const sessionCounts = hostSessionCounts(latestAgents);
      const okHosts = hosts.filter(h => h.ok).length;
      const filterNote = filtered ? `，篩選 ${[...hostFilters].join('、')}` : '';
      document.getElementById('meta').textContent =
        `追蹤 ${s.tracked || 0}，其他 ${s.untracked || 0}` +
        (hosts.length ? `，主機 ${okHosts}/${hosts.length}` : '') +
        filterNote +
        '，約 10 秒更新';
      const hostButtons = [];
      if (hosts.length > 1) {
        const total = Object.values(sessionCounts).reduce((n, v) => n + v, 0);
        const allActive = !filtered;
        const allDim = filtered ? ' dim' : '';
        hostButtons.push(
          `<button type="button" class="host-pill all${allActive ? ' active' : ''}${allDim}" data-host="" aria-pressed="${allActive ? 'true' : 'false'}">全部<span class="count">(${total})</span></button>`
        );
      }
      for (const row of sortedHosts(hosts, sessionCounts)) {
        const tone = hostTone(row.name);
        const active = hostFilters.has(row.name);
        const dim = filtered && !active;
        const offline = row.ok ? '' : (row.stale ? ' bad stale' : ' bad');
        const n = sessionCounts[row.name] || 0;
        const empty = (row.ok && n === 0) ? ' empty' : '';
        const stateSuffix = row.ok ? '' : (row.stale ? ' stale' : ' offline');
        const label = escapeHtml(row.name) + stateSuffix + `<span class="count">(${n})</span>`;
        hostButtons.push(
          `<button type="button" class="host-pill tone-${tone}${offline}${empty}${active ? ' active' : ''}${dim ? ' dim' : ''}" data-host="${escapeHtml(row.name)}" title="${escapeHtml(row.error || row.url || row.source || '')}" aria-pressed="${active ? 'true' : 'false'}">${label}</button>`
        );
      }
      document.getElementById('hosts').innerHTML = hostButtons.join('');
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const err = document.getElementById('error');
      err.hidden = true;
      const shown = visibleAgents();
      renderSummary(visibleSummaryCounts(shown));
      if (!latestAgents.length) {
        list.innerHTML = '';
        empty.hidden = false;
        empty.textContent = hosts.some(h => !h.ok)
          ? '尚無資料。檢查 peers 是否在線，或本機 tmux／hooks。'
          : '沒有 live pane。確認工作機上的 tmux 有在跑。';
        if (sheetOpen) closeSheet();
        return;
      }
      if (!shown.length) {
        list.innerHTML = '';
        empty.hidden = false;
        empty.textContent = `沒有所選主機的 pane。點「全部」或其它主機。`;
        if (sheetOpen) closeSheet();
        return;
      }
      empty.hidden = true;
      const grouped = Object.fromEntries(SECTIONS.map(([key]) => [key, []]));
      for (const a of shown) grouped[category(a)].push(a);
      for (const key of Object.keys(grouped)) {
        grouped[key].sort((a, b) => (b.updated || 0) - (a.updated || 0));
      }
      list.innerHTML = SECTIONS.map(([key, title]) => {
        const rows = grouped[key];
        if (!rows.length) return '';
        const heading = `<div class="section" id="group-${key}" data-group="${key}"><span>${SECTION_EMOJI[key]} ${title}</span><span class="count">${rows.length}</span></div>`;
        return heading + rows.map((a, i) => cardHtml(a, { newest: key === 'review' && i === 0 })).join('');
      }).join('');
      syncSheetFromData();
    }
    function jumpToGroup(key) {
      const el = document.getElementById(`group-${key}`);
      if (!el) return;
      activeGroup = key;
      document.querySelectorAll('.stat[data-group]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.group === key);
      });
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function setupSpeech() {
      if (!SpeechAPI) return;
      recognition = new SpeechAPI();
      const nav = getNavigator();
      recognition.lang = ((nav && nav.language) || 'zh-TW').startsWith('zh') ? 'zh-TW' : ((nav && nav.language) || 'en-US');
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.onstart = () => {
        listening = true;
        document.getElementById('sheet-mic').classList.add('listening');
        document.getElementById('voice-hint').hidden = false;
        document.getElementById('voice-hint').textContent = '聆聽中…再點麥克風結束';
      };
      recognition.onend = () => {
        listening = false;
        document.getElementById('sheet-mic').classList.remove('listening');
        document.getElementById('voice-hint').hidden = true;
      };
      recognition.onerror = async (event) => {
        listening = false;
        document.getElementById('sheet-mic').classList.remove('listening');
        const status = document.getElementById('sheet-status');
        document.getElementById('voice-hint').hidden = true;
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          micPermissionGranted = false;
          const nav = getNavigator();
          if (isMicSecureContext() && !micPromptAttempted && nav && nav.mediaDevices && typeof nav.mediaDevices.getUserMedia === 'function') {
            const wasOpen = sheetOpen;
            const targetKey = selectedKey;
            try {
              await requestMicPermission();
              if ((wasOpen && !sheetOpen) || (targetKey && selectedKey !== targetKey)) return;
              recognition.start();
              return;
            } catch (_) {
              // Fall through to actionable blocked message.
            }
          }
          status.className = 'sheet-feedback bad';
          status.textContent = micBlockedMessage();
          return;
        }
        status.className = 'sheet-feedback bad';
        status.textContent = '語音錯誤: ' + event.error;
      };
      recognition.onresult = (event) => {
        let interim = '';
        let finalText = '';
        for (let i = 0; i < event.results.length; i++) {
          const piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += piece;
          else interim += piece;
        }
        const box = document.getElementById('sheet-text');
        const joined = (speechBase + (finalText || interim)).replace(/\s+/g, ' ').trimStart();
        box.value = joined;
        if (finalText) speechBase = (speechBase + finalText).replace(/\s+/g, ' ');
        if (!speechBase.endsWith(' ') && speechBase) speechBase += ' ';
      };
    }
    document.getElementById('summary').addEventListener('click', (event) => {
      const btn = event.target.closest('.stat[data-group]');
      if (!btn || btn.disabled) return;
      jumpToGroup(btn.dataset.group);
    });
    document.getElementById('hosts').addEventListener('click', (event) => {
      const pill = event.target.closest('.host-pill[data-host]');
      if (!pill) return;
      const name = pill.dataset.host || '';
      if (!name) {
        hostFilters.clear();
      } else if (hostFilters.has(name)) {
        hostFilters.delete(name);
      } else {
        hostFilters.add(name);
      }
      if (latestPayload) render(latestPayload);
    });
    document.getElementById('list').addEventListener('click', (event) => {
      const card = event.target.closest('.card[data-key]');
      if (!card) return;
      const agent = latestAgents.find(a => agentKey(a) === card.dataset.key);
      if (!agent || !agent.tracked) return;
      openSheet(agent);
    });
    document.getElementById('sheet-scrim').addEventListener('click', closeSheet);
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    document.getElementById('sheet-refresh').addEventListener('click', () => {
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      if (!sheetOpen || !agent) return;
      document.getElementById('sheet-status').textContent = '';
      fillSheet(agent);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && sheetOpen) closeSheet();
    });
    document.getElementById('sheet-mic').addEventListener('click', async () => {
      if (!recognition || micRequestInFlight) return;
      if (listening) {
        stopListening();
        return;
      }
      const status = document.getElementById('sheet-status');
      if (!isMicSecureContext()) {
        status.className = 'sheet-feedback bad';
        status.textContent = micBlockedMessage();
        return;
      }
      micRequestInFlight = true;
      const wasOpen = sheetOpen;
      const targetKey = selectedKey;
      try {
        await requestMicPermission();
        if ((wasOpen && !sheetOpen) || (targetKey && selectedKey !== targetKey)) return;
        speechBase = document.getElementById('sheet-text').value;
        if (speechBase && !speechBase.endsWith(' ')) speechBase += ' ';
        recognition.start();
      } catch (e) {
        status.className = 'sheet-feedback bad';
        if (e && (e.code === 'insecure-context' || e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError')) {
          status.textContent = micBlockedMessage();
        } else if (e && (e.name === 'NotFoundError' || e.name === 'DevicesNotFoundError')) {
          status.textContent = '找不到可用的麥克風裝置';
        } else {
          status.textContent = (e && e.message) || '無法開始語音';
        }
      } finally {
        micRequestInFlight = false;
      }
    });
    document.getElementById('sheet-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      stopListening();
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      const status = document.getElementById('sheet-status');
      const button = document.getElementById('sheet-send');
      const text = document.getElementById('sheet-text').value;
      if (!agent) return;
      button.disabled = true;
      status.className = 'sheet-feedback';
      status.textContent = '送出中…';
      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid, text, submit: true }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        status.className = 'sheet-feedback ok';
        status.textContent = '已貼上';
        document.getElementById('sheet-text').value = '';
        setTimeout(closeSheet, 280);
      } catch (e) {
        status.className = 'sheet-feedback bad';
        status.textContent = e.message;
      } finally {
        button.disabled = false;
      }
    });
    document.getElementById('sheet-kill').addEventListener('click', async () => {
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      const status = document.getElementById('sheet-status');
      const btn = document.getElementById('sheet-kill');
      if (!agent) return;
      const now = Date.now();
      if (now > killArmedUntil) {
        killArmedUntil = now + 5000;
        btn.classList.add('armed');
        btn.setAttribute('aria-label', '再按一次確認關閉');
        btn.title = '5 秒內再按一次確認關閉';
        status.className = 'sheet-feedback';
        status.textContent = '再按一次確認關閉';
        return;
      }
      btn.disabled = true;
      status.className = 'sheet-feedback';
      status.textContent = '關閉中…';
      try {
        const res = await fetch('/api/kill', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        status.className = 'sheet-feedback ok';
        status.textContent = '已關閉 pane';
        setTimeout(() => { closeSheet(); refresh(); }, 320);
      } catch (e) {
        status.className = 'sheet-feedback bad';
        status.textContent = e.message;
        resetKillArm();
        btn.disabled = false;
      }
    });
    const POLL_MS = 10000;
    let refreshInFlight = false;
    let hasLoaded = false;

    const REFRESH_HINT_MIN_MS = 280;

    function setColdSkeleton(on) {
      document.body.classList.toggle('is-loading', on);
      const clock = document.getElementById('clock');
      if (on) {
        clock.textContent = '…';
        clock.dataset.state = 'loading';
      }
    }

    function setRefreshing(on) {
      const header = document.querySelector('header');
      const bar = document.getElementById('refresh-bar');
      const clock = document.getElementById('clock');
      if (header) header.classList.toggle('is-refreshing', on);
      if (bar) {
        bar.hidden = !on;
        bar.setAttribute('aria-hidden', on ? 'false' : 'true');
      }
      if (on && clock.dataset.state !== 'offline') {
        clock.textContent = 'live';
        clock.dataset.state = 'updating';
      }
    }

    async function refresh() {
      if (refreshInFlight) return;
      refreshInFlight = true;
      const clock = document.getElementById('clock');
      const cold = !hasLoaded;
      const started = performance.now();
      if (cold) setColdSkeleton(true);
      else setRefreshing(true);
      try {
        const res = await fetch('/api/fleet', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'payload error');
        render(data);
        hasLoaded = true;
        document.getElementById('error').hidden = true;
        if (cold) {
          setColdSkeleton(false);
        } else {
          const elapsed = performance.now() - started;
          if (elapsed < REFRESH_HINT_MIN_MS) {
            await new Promise(r => setTimeout(r, REFRESH_HINT_MIN_MS - elapsed));
          }
          setRefreshing(false);
        }
        clock.textContent = 'live';
        clock.dataset.state = 'live';
      } catch (e) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = '無法讀取狀態：' + e.message;
        if (cold) {
          // Stay on skeleton until first success.
        } else {
          setRefreshing(false);
        }
        clock.textContent = 'offline';
        clock.dataset.state = 'offline';
      } finally {
        refreshInFlight = false;
      }
    }
    setupSpeech();
    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
