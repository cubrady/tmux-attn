<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="tmux attention — multi-host agent status">
  <title>Attention</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@450;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
  <style>
    :root {
      --bg: #f4f5f7;
      --bg-elevated: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --line: #e4e4e7;
      --card: #ffffff;
      --accent: #0f766e;
      --accent-fg: #f8fafc;
      --wait: #c2410c;
      --review: #0369a1;
      --running: #15803d;
      --idle: #71717a;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --danger-fg: #ffffff;
      --radius: 8px;
      --font: "Outfit", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --max: 42rem;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --header-bg: color-mix(in srgb, var(--bg) 86%, transparent);
      --sheet-bg: #ffffff;
      --scrim: rgb(24 24 27 / 0.42);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0c0e;
        --bg-elevated: #141417;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --line: #27272a;
        --card: #18181b;
        --accent: #2dd4bf;
        --accent-fg: #042f2e;
        --wait: #fb923c;
        --review: #38bdf8;
        --running: #4ade80;
        --idle: #a1a1aa;
        --danger: #f87171;
        --danger-bg: #450a0a;
        --danger-fg: #2a0707;
        --header-bg: color-mix(in srgb, var(--bg) 88%, transparent);
        --sheet-bg: #18181b;
        --scrim: rgb(0 0 0 / 0.55);
      }
    }
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      font: 15px/1.45 var(--font);
      color: var(--fg);
      background: var(--bg);
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }
    body.sheet-open { overflow: hidden; }
    .wrap {
      width: min(100%, var(--max));
      margin: 0 auto;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      margin: -4px -8px 0;
      padding: 10px 8px 12px;
      background: var(--header-bg);
      backdrop-filter: blur(16px) saturate(1.2);
      -webkit-backdrop-filter: blur(16px) saturate(1.2);
      border-bottom: 1px solid var(--line);
    }
    .refresh-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 140ms var(--ease);
      background: transparent;
    }
    header.is-refreshing .refresh-bar {
      opacity: 1;
    }
    .refresh-bar::after {
      content: "";
      display: block;
      height: 100%;
      width: 36%;
      border-radius: 1px;
      background: color-mix(in srgb, var(--running) 85%, var(--accent));
      animation: refresh-slide 1.05s var(--ease) infinite;
    }
    @keyframes refresh-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .live[data-state="updating"]::before { animation: none; }
      .refresh-bar::after {
        animation: none;
        width: 100%;
        opacity: 0.55;
        transform: none;
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      header {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        background: var(--card);
      }
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1;
      padding: 5px 9px 5px 8px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--running) 35%, var(--line));
      color: var(--running);
      background: color-mix(in srgb, var(--running) 14%, var(--card));
    }
    .live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 22%, transparent);
    }
    .live[data-state="loading"] {
      color: var(--muted);
      border-color: var(--line);
      background: color-mix(in srgb, var(--line) 35%, var(--card));
    }
    .live[data-state="updating"] {
      color: color-mix(in srgb, var(--running) 72%, var(--muted));
      border-color: color-mix(in srgb, var(--running) 28%, var(--line));
      background: color-mix(in srgb, var(--running) 10%, var(--card));
    }
    .live[data-state="updating"]::before {
      animation: live-pulse 1.1s ease-in-out infinite;
    }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent); }
      50% { opacity: 0.45; box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 10%, transparent); }
    }
    .live[data-state="offline"] {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
      background: color-mix(in srgb, var(--danger) 12%, var(--card));
    }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 12px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 4%, transparent);
    }
    .stat {
      appearance: none;
      display: block;
      width: 100%;
      margin: 0;
      border: 0;
      background: var(--card);
      padding: 16px 8px 14px;
      text-align: center;
      color: inherit;
      font: inherit;
      cursor: pointer;
      min-height: 4.5rem;
    }
    .stat:disabled {
      opacity: 0.42;
      cursor: default;
    }
    .stat:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
      z-index: 1;
      position: relative;
    }
    .stat.active {
      background: color-mix(in srgb, var(--accent) 12%, var(--card));
    }
    .stat .n {
      font-family: var(--mono);
      font-size: clamp(1rem, 5vw, 1.45rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      line-height: 1.15;
      white-space: nowrap;
    }
    .stat .l {
      margin-top: 6px;
      min-height: 1.45em;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .hosts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }
    .host-pill {
      appearance: none;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--line);
      cursor: pointer;
      line-height: 1.2;
      color: var(--host-fg, var(--muted));
      background: var(--host-bg, var(--bg-elevated));
      border-color: var(--host-bd, var(--line));
    }
    .host-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .host-pill.all {
      --host-fg: var(--muted);
      --host-bg: var(--bg-elevated);
      --host-bd: var(--line);
      font-weight: 500;
    }
    .host-pill.tone-0 { --host-fg: #0f766e; --host-bg: #ccfbf1; --host-bd: #5eead4; }
    .host-pill.tone-1 { --host-fg: #b45309; --host-bg: #ffedd5; --host-bd: #fdba74; }
    .host-pill.tone-2 { --host-fg: #1d4ed8; --host-bg: #dbeafe; --host-bd: #93c5fd; }
    .host-pill.tone-3 { --host-fg: #be123c; --host-bg: #ffe4e6; --host-bd: #fda4af; }
    .host-pill.tone-4 { --host-fg: #3f6212; --host-bg: #ecfccb; --host-bd: #bef264; }
    .host-pill.tone-5 { --host-fg: #0e7490; --host-bg: #cffafe; --host-bd: #67e8f9; }
    .host-pill.tone-6 { --host-fg: #a16207; --host-bg: #fef9c3; --host-bd: #fde047; }
    .host-pill.tone-7 { --host-fg: #9a3412; --host-bg: #ffedd5; --host-bd: #fb923c; }
    .host-pill.bad {
      opacity: 0.72;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }
    .host-pill.active {
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--host-fg, var(--accent)) 55%, transparent);
      opacity: 1;
    }
    /* Online but idle: mute colors only — avoid filter (breaks flex wrap / overflow). */
    .host-pill.empty:not(.active):not(.bad) {
      --host-fg: var(--muted);
      --host-bg: color-mix(in srgb, var(--line) 42%, var(--card));
      --host-bd: var(--line);
      font-weight: 500;
      box-shadow: none;
      opacity: 0.72;
    }
    .host-pill.empty:not(.active):not(.bad):hover,
    .host-pill.empty:not(.active):not(.bad):focus-visible {
      opacity: 0.92;
      --host-bd: color-mix(in srgb, var(--muted) 35%, var(--line));
    }
    .host-pill.dim {
      opacity: 0.4;
      box-shadow: none;
    }
    .host-pill.dim:hover,
    .host-pill.dim:focus-visible {
      opacity: 0.7;
    }
    .host-pill .count {
      font-weight: 500;
      opacity: 0.88;
      margin-left: 0.15em;
    }
    @media (prefers-color-scheme: dark) {
      .host-pill.tone-0 { --host-fg: #5eead4; --host-bg: #042f2e; --host-bd: #0f766e; }
      .host-pill.tone-1 { --host-fg: #fdba74; --host-bg: #431407; --host-bd: #c2410c; }
      .host-pill.tone-2 { --host-fg: #93c5fd; --host-bg: #172554; --host-bd: #1d4ed8; }
      .host-pill.tone-3 { --host-fg: #fda4af; --host-bg: #4c0519; --host-bd: #be123c; }
      .host-pill.tone-4 { --host-fg: #bef264; --host-bg: #1a2e05; --host-bd: #4d7c0f; }
      .host-pill.tone-5 { --host-fg: #67e8f9; --host-bg: #083344; --host-bd: #0e7490; }
      .host-pill.tone-6 { --host-fg: #fde047; --host-bg: #422006; --host-bd: #a16207; }
      .host-pill.tone-7 { --host-fg: #fb923c; --host-bg: #431407; --host-bd: #c2410c; }
    }
    main.list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
      padding-bottom: 8px;
    }
    .section {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 12px 0 2px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      scroll-margin-top: 7.5rem;
    }
    .section:first-child { margin-top: 4px; }
    .section .count {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.72rem;
      opacity: 0.9;
    }
    .section[data-group="review"] {
      color: var(--review);
    }
    .section[data-group="review"] .count {
      padding: 1px 6px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--review) 16%, transparent);
      opacity: 1;
    }
    .review-state { display: inline-flex; align-items: center; gap: 4px; font-size: 0.68rem; font-weight: 500; color: var(--muted); }
    .review-state.unread { color: var(--review); font-weight: 600; }
    .review-state.unread::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .card {
      position: relative;
      background: var(--card);
      border-radius: var(--radius);
      padding: 12px 12px 12px 14px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--idle);
      transition: border-color 160ms var(--ease), background 160ms var(--ease);
      cursor: pointer;
    }
    .card.shell { cursor: default; }
    /* The whole card is one button; the trash sits above it so the two never nest. */
    .card-open {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: inherit;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .card-open:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
    @media (prefers-reduced-motion: no-preference) {
      .card { transition: border-color 160ms var(--ease), background 160ms var(--ease), transform 140ms var(--ease); }
      .card:active { transform: scale(0.985); }
    }
    .card.selected {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      background: color-mix(in srgb, var(--accent) 6%, var(--card));
    }
    .card.wait { border-left-color: var(--wait); }
    .card.review.unread {
      border-left-color: var(--review);
      background: color-mix(in srgb, var(--review) 7%, var(--card));
    }
    .card.review.unread.newest {
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--review) 40%, transparent);
      background: color-mix(in srgb, var(--review) 11%, var(--card));
    }
    .card.running { border-left-color: var(--running); }
    .card.idle { border-left-color: var(--idle); }
    .card.shell {
      border-left-color: color-mix(in srgb, var(--muted) 40%, var(--line));
      background: color-mix(in srgb, var(--card) 70%, var(--bg));
    }
    .card.error {
      border-color: color-mix(in srgb, var(--danger) 55%, var(--line));
      border-left-color: var(--danger);
      background: var(--danger-bg);
    }
    .row1 {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      justify-content: space-between;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      font-weight: 600;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      min-width: 0;
    }
    .emoji { font-size: 1.05rem; line-height: 1; }
    .project { min-width: 0; overflow-wrap: anywhere; }
    .cli {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--bg);
      flex: 0 0 auto;
    }
    .cli img { width: 16px; height: 16px; display: block; }
    @media (prefers-color-scheme: dark) {
      .cli.agent img { filter: invert(1); }
    }
    .cli.broken::after {
      content: attr(title);
      font-family: var(--mono);
      font-size: 0.55rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--muted);
      max-width: 26px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
    }
    .age {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
      padding-top: 3px;
    }
    .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .env {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: baseline;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      min-width: 0;
    }
    .env .repo { color: color-mix(in srgb, var(--fg) 72%, var(--muted)); }
    .env .model { color: var(--muted); white-space: nowrap; }
    .env .model::before { content: "· "; }
    .env .branch { color: var(--muted); overflow-wrap: anywhere; }
    .env .dirty {
      color: var(--wait);
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sheet-env {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      font: 0.7rem/1.4 var(--mono);
      color: var(--muted);
    }
    .sheet-env[hidden] { display: none; }
    .sheet-env .dirty { color: var(--wait); }
    .sheet-env .effort::before { content: "· "; }
    .path-toggle {
      padding: 1px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }
    .path-toggle[aria-expanded="true"] { background: var(--bg); color: var(--fg); }
    .path-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .reason {
      margin-top: 7px;
      font-size: 0.88rem;
      color: color-mix(in srgb, var(--fg) 82%, var(--muted));
      text-wrap: pretty;
    }
    .card.error .reason { color: var(--danger); font-weight: 500; }
    .preview {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .preview-line {
      display: grid;
      grid-template-columns: 2.4rem minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      font-size: 0.84rem;
      line-height: 1.4;
    }
    .preview-line .who {
      font-family: var(--mono);
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--muted);
      padding-top: 3px;
    }
    .preview-line.user .text {
      color: var(--fg);
      font-weight: 500;
      text-wrap: pretty;
    }
    .preview-line.user:last-of-type .text { font-weight: 600; }
    .preview-line.agent {
      margin-top: 3px;
      padding-top: 6px;
      border-top: 1px dashed var(--line);
    }
    .preview-line.agent .text {
      color: var(--muted);
      text-wrap: pretty;
    }
    /* Card previews: result first, the latest prompt as muted context, cut on whole lines. */
    .card .preview-line { grid-template-columns: minmax(0, 1fr); }
    .card .preview-line .who {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .card .preview-line.agent { margin-top: 0; padding-top: 0; border-top: 0; }
    .card .preview-line .text.md {
      max-height: calc(1.45em * 5);
      overflow: hidden;
    }
    .card .preview-line .text.md > * { margin: 0; }
    .card .preview-line .text.md.clipped {
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 1.45em), transparent);
      mask-image: linear-gradient(to bottom, #000 calc(100% - 1.45em), transparent);
    }
    .card.review.unread .preview-line.agent .text,
    .card.wait .preview-line.agent .text { color: var(--fg); }
    .card .preview-line.user {
      position: relative;
      padding-left: 0.95rem;
      font-size: 0.8rem;
    }
    .card .preview-line.user::before {
      content: '›';
      position: absolute;
      left: 0.1rem;
      color: var(--muted);
      font-weight: 600;
    }
    .card .preview-line.user .text.md {
      max-height: calc(1.45em * 2);
      color: var(--muted);
      font-weight: 400;
    }
    .sheet-preview .preview-line .text {
      overflow-wrap: anywhere;
    }
    .sheet-preview .preview-line .text.md {
      max-height: none;
      overflow: visible;
    }
    .preview-line .text.md {
      font-size: inherit;
      line-height: 1.45;
    }
    .preview-line .text.md > :first-child { margin-top: 0; }
    .preview-line .text.md > :last-child { margin-bottom: 0; }
    .preview-line .text.md p,
    .preview-line .text.md ul,
    .preview-line .text.md ol,
    .preview-line .text.md pre,
    .preview-line .text.md blockquote,
    .preview-line .text.md table {
      margin: 0.35em 0;
    }
    .preview-line .text.md h1,
    .preview-line .text.md h2,
    .preview-line .text.md h3,
    .preview-line .text.md h4 {
      margin: 0.55em 0 0.25em;
      font-size: 1em;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1.3;
    }

  <script>
    const SECTIONS = [
      ['wait', '等待回覆'],
      ['review', '待看'],
      ['idle', '閒置'],
      ['running', '進行中'],
      ['shell', '其他 pane'],
    ];
    const SECTION_EMOJI = { wait: '🙋', review: '👀', running: '🏃', idle: '💤', shell: '💻' };
    // Reasons that only repeat what the emoji, badge and section title already say.
    const GENERIC_REASONS = new Set(['已完成，尚未查看', '已完成，已查看', '閒置，等待新任務', '正在工作']);
    let selectedKey = '';
    let latestAgents = [];
    let latestHosts = [];
    let latestPayload = null;
    let hostFilters = new Set(); // empty = show all hosts
    let activeGroup = '';
    let sheetOpen = false;
    let sheetPreviewKey = '';
    let sheetPreviewFull = false;
    let sheetPreviewUpdated = 0;
    let sheetPreviewRevision = 0;
    let sheetPreviewToken = 0;
    const acknowledgedVersions = new Map();
    const acknowledgementsInFlight = new Map();
    const PEER_OUTDATED = 'peer is running an older tmux-attn without this feature';
    const READER_PREFIX = '#/m/';
    const READER_SIG_CHARS = 200;
    let sheetPreviewData = { users: [], agent: '' };
    let readerOpen = false;
    let readerHash = '';
    let readerPushed = false;
    let readerToken = 0;
    let readerText = '';
    let routeSettled = false;
    const readerSigs = new Map();
    const READER_SIG_STORE = 'attn.readerSigs';
    // Only the current sheet snapshot is cached (at most three prompts and one reply).
    const readerMessages = new Map();
    const replyDrafts = new Map();
    const DRAFT_STORE_PREFIX = 'attn.replyDraft.';
    const MAX_ATTACHMENTS = 4;
    const MAX_IMAGE_EDGE = 2048;
    const MAX_ATTACHMENT_BYTES = 8 * 1024 * 1024;
    const UPLOADING_NOTICE = '附件上傳中，請稍候再送出';
    let attachments = []; // { key, name, kind, previewUrl, status, uploadId, error }
    let attachmentSeq = 0;
    const STALE_HOST_TTL_MS = 35000;
    const lastGoodByHost = new Map();

    function agentKey(a) {
      return [a.host || '', a.pane || '', a.pid || ''].join('|');
    }
    function saveReplyDraft(key, text) {
      if (!key) return;
      replyDrafts.set(key, text);
      try {
        if (text) localStorage.setItem(DRAFT_STORE_PREFIX + key, text);
        else localStorage.removeItem(DRAFT_STORE_PREFIX + key);
      } catch (_) { /* Keep drafts in memory when browser storage is unavailable. */ }
    }
    function readReplyDraft(key) {
      if (replyDrafts.has(key)) return replyDrafts.get(key);
      try {
        return localStorage.getItem(DRAFT_STORE_PREFIX + key) || '';
      } catch (_) {
        return replyDrafts.get(key) || '';
      }
    }
    function saveCurrentReplyDraft() {
      if (sheetOpen) saveReplyDraft(selectedKey, document.getElementById('sheet-text').value);
    }
    // Both commands pin the deployed code to the hub's own commit, so a peer converges on the hub, not on main.
    const updateCommand = hub => `tmux-attn update --ref ${hub}`;
    const bootstrapCommand = hub => `curl -fsSL https://raw.githubusercontent.com/cubrady/tmux-attn/main/update.sh | TMUX_ATTN_REF=${hub} sh`;
    let updateHintHtml = '';
    function shortVersion(version) {
      return String(version || '').slice(0, 7);
    }
    // Peers on a different version than the hub. A peer that reports none predates `tmux-attn update`.
    function renderUpdateHint(hosts, hubVersion) {
      const el = document.getElementById('update-hint');
      const behind = /^[0-9a-f]{7,40}$/.test(hubVersion)
        ? hosts.filter(h => h.ok && h.source === 'peer' && (h.version || '') !== hubVersion) : [];
      el.hidden = behind.length === 0;
      const rows = behind.map(h => {
        const cmd = h.version ? updateCommand(hubVersion) : bootstrapCommand(hubVersion);
        const state = `${h.version ? shortVersion(h.version) : '未回報版本'} → hub ${shortVersion(hubVersion)}`;
        return `<div class="update-row"><div class="update-host"><strong>${escapeHtml(h.name)}</strong>` +
          `<span class="update-state">${escapeHtml(state)}</span></div>` +
          `<div class="update-cmd"><code>${escapeHtml(cmd)}</code>` +
          `<button type="button" class="copy-cmd" data-copy="${escapeHtml(cmd)}">複製</button></div></div>`;
      });
      const html = behind.length ? '<div class="update-title">版本與 hub 不一致，請在該主機執行：</div>' + rows.join('') : '';
      // The poll renders every 10s; rewriting identical markup would drop a text selection and the 已複製 label.
      if (html !== updateHintHtml) {
        updateHintHtml = html;
        el.innerHTML = html;
      }
    }
    function agentName(a) {
      return a.project || a.window || '未命名專案';
    }
    function hostTone(name) {
      const text = String(name || '');
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
      return Math.abs(hash) % 8;
    }
    function agentHostName(a) {
      return a.host || latestHosts.find(h => h.source === 'local')?.name || 'local';
    }
    function visibleAgents() {
      if (!hostFilters.size) return latestAgents;
      return latestAgents.filter(a => hostFilters.has(agentHostName(a)));
    }
    function hostSessionCounts(agents) {
      // Count tracked agent sessions only — bare shell panes are not sessions.
      const counts = Object.create(null);
      for (const a of agents) {
        if (category(a) === 'shell') continue;
        const name = agentHostName(a);
        counts[name] = (counts[name] || 0) + 1;
      }
      return counts;
    }
    function sortedHosts(hosts, sessionCounts) {
      return [...hosts].sort((a, b) => {
        const countDiff = (sessionCounts[b.name] || 0) - (sessionCounts[a.name] || 0);
        if (countDiff) return countDiff;
        if (!!a.ok !== !!b.ok) return a.ok ? -1 : 1;
        return String(a.name || '').localeCompare(String(b.name || ''), 'en');
      });
    }
    function category(agent) {
      if (agent.tracked === false || agent.state === 'SHELL') return 'shell';
      // The server owns classification; a just-confirmed version moves immediately.
      if (['wait', 'review', 'running', 'idle'].includes(agent.category)) {
        return agent.category === 'review' && !isUnread(agent) ? 'idle' : agent.category;
      }
      // Compatibility with older peers that do not publish a category yet.
      if (agent.state === 'WAIT') return 'wait';
      if (agent.state === 'RUNNING') return 'running';
      return isUnread(agent) ? 'review' : 'idle';
    }
    function isUnread(agent) {
      const reviewable = agent.state === 'WAIT' || (agent.needs_review ?? agent.unread ?? agent.pending ?? false);
      if (!reviewable) return false;
      const acknowledged = Math.max(Number(agent.acknowledged) || 0, acknowledgedVersions.get(agentKey(agent)) || 0);
      if (Number.isInteger(agent.revision) && agent.revision > 0) return agent.revision > acknowledged;
      return agent.unread ?? agent.pending ?? !agent.reviewed;
    }
    const CLI_ICONS = { claude: 'claude', codex: 'codex', agent: 'agent', cursor: 'agent', pi: 'pi' };
    function cliBadge(cli) {
      const name = String(cli || '').toLowerCase();
      if (!Object.hasOwn(CLI_ICONS, name)) return '';
      const icon = escapeHtml(CLI_ICONS[name]);
      return `<span class="cli ${icon}" title="${escapeHtml(name)}"><img src="/icons/${icon}.svg" alt="${escapeHtml(name)}" loading="lazy" onerror="this.closest('.cli').classList.add('broken');this.remove()"></span>`;
    }
    function renderMarkdown(text) {
      const raw = String(text ?? '');
      if (!raw) return '';
      try {
        if (typeof marked !== 'undefined' && typeof DOMPurify !== 'undefined') {
          if (!renderMarkdown._ready) {
            marked.setOptions({ gfm: true, breaks: true });
            renderMarkdown._ready = true;
          }
          const html = marked.parse(raw, { async: false });
          return DOMPurify.sanitize(html, {
            USE_PROFILES: { html: true },
            ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto):|[^a-z]|[a-z+.-]+(?:[^a-z+.-:]|$))/i,
          });
        }
      } catch (_) { /* fall through */ }
      return escapeHtml(raw).replace(/\n/g, '<br>');
    }
    function previewLineHtml(role, text, attrs = '', hint = '') {
      const label = role === 'user' ? '你' : '結果';
      return `<div class="preview-line ${role}"${attrs}><span class="who">${label}</span><span class="text md">${renderMarkdown(text)}</span>${hint}</div>`;
    }
    // Sheet transcript: older prompts fold into one line; the latest prompt then the result keep their order.
    let sheetEarlierOpen = false;
    let sheetShown = { preview: null, actionable: false };
    function previewHtml(preview, { actionable = false } = {}) {
      const users = Array.isArray(preview?.users) ? preview.users.filter(Boolean) : [];
      const agentLine = preview?.agent || '';
      if (!users.length && !agentLine) return '';
      const target = (role, index) => actionable ? ` data-role="${role}" data-index="${index}"` : '';
      const openFull = actionable ? '<button type="button" class="open-full">全文</button>' : '';
      const lines = users.map((text, i) => previewLineHtml('user', text, target('user', i), openFull));
      const latest = lines.pop() || '';
      const earlier = lines.length
        ? `<button type="button" class="earlier-toggle" data-earlier aria-expanded="${sheetEarlierOpen}">較早的 ${lines.length} 則訊息</button>` +
          `<div class="earlier"${sheetEarlierOpen ? '' : ' hidden'}>${lines.join('')}</div>` : '';
      return `<div class="preview">${earlier}${latest}${
        agentLine ? previewLineHtml('agent', agentLine, target('agent', 0), openFull) : ''}</div>`;
    }
    function renderSheetPreview(preview, actionable) {
      sheetShown = { preview, actionable };
      document.getElementById('sheet-preview').innerHTML = previewHtml(preview, { actionable }) || emptyPreviewHtml();
      markClippedPreviews();

        button.textContent = '無法複製';
      }
    });
    document.getElementById('summary').addEventListener('click', (event) => {
      const btn = event.target.closest('.stat[data-group]');
      if (!btn || btn.disabled) return;
      jumpToGroup(btn.dataset.group);
    });
    document.getElementById('hosts').addEventListener('click', (event) => {
      const pill = event.target.closest('.host-pill[data-host]');
      if (!pill) return;
      const name = pill.dataset.host || '';
      if (!name) {
        hostFilters.clear();
      } else if (hostFilters.has(name)) {
        hostFilters.delete(name);
      } else {
        hostFilters.add(name);
      }
      if (latestPayload) render(latestPayload);
    });
    document.getElementById('list').addEventListener('click', (event) => {
      const card = event.target.closest('.card[data-key]');
      if (!card) return;
      if (event.target.closest('[data-kill]')) return onCardKill(card.dataset.key);
      const agent = latestAgents.find(a => agentKey(a) === card.dataset.key);
      if (!agent || !agent.tracked) return;
      openSheet(agent);
    });
    document.getElementById('sheet-scrim').addEventListener('click', closeSheet);
    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    document.getElementById('sheet-refresh').addEventListener('click', () => {
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      if (!sheetOpen || !agent) return;
      document.getElementById('sheet-status').textContent = '';
      fillSheet(agent);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (readerOpen) closeReader();
      else if (sheetOpen) closeSheet();
    });
    window.addEventListener('hashchange', applyRoute);
    // Line wraps change when the web font arrives or the window resizes, so the clipped marks must follow.
    window.addEventListener('resize', markClippedPreviews);
    if (document.fonts) document.fonts.addEventListener('loadingdone', markClippedPreviews);
    document.getElementById('sheet-env').addEventListener('click', (event) => {
      const toggle = event.target.closest('[data-toggle-path]');
      if (!toggle) return;
      sheetPathOpen = !sheetPathOpen;
      toggle.setAttribute('aria-expanded', String(sheetPathOpen));
      document.getElementById('sheet-path').hidden = !sheetPathOpen;
    });
    let drag = null;
    function resetDrag() {
      drag = null;
      const panel = document.getElementById('sheet-panel');
      if (!panel.style) return;
      panel.style.transform = '';
      panel.classList.remove('dragging');
    }
    // Swipe the handle or header down to dismiss; anything that starts on a button stays that button's.
    const dragZone = document.getElementById('sheet-drag');
    dragZone.addEventListener('pointerdown', (event) => {
      // Touch and pen only: with a mouse a downward text selection or a right-click would dismiss the sheet.
      if (event.pointerType === 'mouse' || event.isPrimary === false || event.target.closest('button')) return;
      drag = { y: event.clientY, at: performance.now(), id: event.pointerId };
      if (event.currentTarget && event.currentTarget.setPointerCapture) event.currentTarget.setPointerCapture(event.pointerId);
      document.getElementById('sheet-panel').classList.add('dragging');
    });
    dragZone.addEventListener('pointermove', (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      document.getElementById('sheet-panel').style.transform = `translateY(${Math.max(0, event.clientY - drag.y)}px)`;
    });
    function endDrag(event) {
      if (!drag || event.pointerId !== drag.id) return;
      const outcome = dragOutcome(event.clientY - drag.y, performance.now() - drag.at);
      resetDrag();
      if (outcome === 'dismiss') closeSheet();
    }
    dragZone.addEventListener('pointerup', endDrag);
    dragZone.addEventListener('pointercancel', resetDrag);
    dragZone.addEventListener('lostpointercapture', resetDrag);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', applyViewport);
      window.visualViewport.addEventListener('scroll', applyViewport);
    }
    document.getElementById('sheet-preview').addEventListener('click', (event) => {
      const fold = event.target.closest('[data-earlier]');
      if (fold) {
        // In place, not a re-render: replacing the button would drop keyboard focus.
        sheetEarlierOpen = !sheetEarlierOpen;
        fold.setAttribute('aria-expanded', String(sheetEarlierOpen));
        if (fold.nextElementSibling) fold.nextElementSibling.hidden = !sheetEarlierOpen;
        markClippedPreviews();
        return;
      }
      if (event.target.closest('a[href]')) return;
      const picked = typeof window.getSelection === 'function' ? String(window.getSelection()) : '';
      if (picked.trim()) return;
      const line = event.target.closest('.preview-line[data-role]');
      if (line) openReaderFromSheet(line.dataset.role, Number(line.dataset.index));
    });
    // The title is agent-written markdown: controls rendered inside it are never ours.
    const askControl = (event, selector) => !event.target.closest('.ask-title') && event.target.closest(selector);
    document.getElementById('sheet-ask').addEventListener('click', (event) => {
      const submit = askControl(event, '.ask-submit');
      if (submit) {
        submitAnswers(submit.dataset.group);
        return;
      }
      const button = askControl(event, '.ask-option');
      const q = button && sheetQuestions.find(item => item.id === button.dataset.qid);
      if (!q) return;
      const st = askAnswer(q);
      const index = Number(button.dataset.option);
      if (q.multi) {
        st.options = st.options.includes(index) ? st.options.filter(i => i !== index) : [...st.options, index].sort((x, y) => x - y);
      } else {
        st.option = index;
        st.text = '';
      }
      askStatus.delete(q.group);
      renderSheetQuestions();
    });
    document.getElementById('sheet-ask').addEventListener('input', (event) => {
      const input = askControl(event, '.ask-other');
      const q = input && sheetQuestions.find(item => item.id === input.dataset.qid);
      if (!q) return;
      const st = askAnswer(q);
      st.text = input.value;
      // Typed text replaces a picked option; update in place so the field keeps focus and the keyboard stays up.
      const typed = Boolean(st.text.trim());
      (input.parentNode?.querySelectorAll?.('.ask-option') || []).forEach(el =>
        el.setAttribute('aria-checked', String(!typed && Number(el.dataset.option) === st.option)));
    });
    document.getElementById('sheet-ask').addEventListener('keydown', (event) => {
      const input = askControl(event, '.ask-other');
      if (!input || event.key !== 'Enter' || event.isComposing) return;
      event.preventDefault();
      const q = sheetQuestions.find(item => item.id === input.dataset.qid);
      if (q) submitAnswers(q.group);
    });
    document.getElementById('reader-back').addEventListener('click', closeReader);
    document.getElementById('reader-copy').addEventListener('click', copyReaderText);
    document.getElementById('sheet-text').addEventListener('input', saveCurrentReplyDraft);
    window.addEventListener('pagehide', saveCurrentReplyDraft);
    document.getElementById('reader-body').addEventListener('click', (event) => {
      if (!event.target.closest('[data-retry]')) return;
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      const route = parseReaderHash(window.location.hash);
      if (!agent || !route) return;
      loadReaderMessage(agent, route, '');
    });
    document.getElementById('sheet-attach').addEventListener('click', () => document.getElementById('sheet-file').click());
    const fileInput = document.getElementById('sheet-file');
    fileInput.addEventListener('change', () => {
      addAttachments(fileInput.files);
      fileInput.value = '';
    });
    document.getElementById('sheet-attachments').addEventListener('click', (event) => {
      if (!event.target.closest('[data-remove]')) return;
      const chip = event.target.closest('.attachment[data-key]');
      if (chip) removeAttachment(chip.dataset.key);
    });
    document.getElementById('sheet-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const agent = latestAgents.find(a => agentKey(a) === selectedKey && a.tracked);
      const status = document.getElementById('sheet-status');
      const button = document.getElementById('sheet-send');
      const text = document.getElementById('sheet-text').value;
      if (!agent || button.disabled) return;
      const targetKey = agentKey(agent);
      saveReplyDraft(targetKey, text);
      if (attachments.some(item => item.status === 'uploading')) {
        setSheetStatus(UPLOADING_NOTICE);
        return;
      }
      if (attachments.some(item => item.status === 'error')) {
        setSheetStatus('有附件上傳失敗，請移除後再送出', 'bad');
        return;
      }
      const images = attachments.filter(item => item.kind === 'image').map(item => item.uploadId);
      const files = attachments.filter(item => item.kind === 'file').map(item => item.uploadId);
      button.disabled = true;
      document.getElementById('sheet-attach').disabled = true;
      status.className = 'sheet-feedback';
      status.textContent = '送出中…';
      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ host: agent.host || '', pane: agent.pane, pid: agent.pid, text, submit: true, images,
            ...(files.length ? { files } : {}) }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
        if (!sheetOpen || selectedKey !== targetKey) {
          if (readReplyDraft(targetKey) === text) saveReplyDraft(targetKey, '');
          return;
        }
        status.className = 'sheet-feedback ok';
        status.textContent = '已貼上';
        const input = document.getElementById('sheet-text');
        if (input.value === text) input.value = '';
        saveReplyDraft(targetKey, input.value);
        clearAttachments();
        sentAt.set(agentKey(agent), Date.now());
        refresh();
        setTimeout(refresh, 1500);
        if (!input.value) closeSheet();
      } catch (e) {
        if (!sheetOpen || selectedKey !== targetKey) return;
        status.className = 'sheet-feedback bad';
        status.textContent = e.message;
      } finally {
        button.disabled = false;
        renderAttachments();
      }
    });
    const POLL_MS = 10000;
    let refreshInFlight = false;
    let hasLoaded = false;

    const REFRESH_HINT_MIN_MS = 280;

    function setColdSkeleton(on) {
      document.body.classList.toggle('is-loading', on);
      const clock = document.getElementById('clock');
      if (on) {
        clock.textContent = '…';
        clock.dataset.state = 'loading';
      }
    }

    function setRefreshing(on) {
      const header = document.querySelector('header');
      const bar = document.getElementById('refresh-bar');
      const clock = document.getElementById('clock');
      if (header) header.classList.toggle('is-refreshing', on);
      if (bar) {
        bar.hidden = !on;
        bar.setAttribute('aria-hidden', on ? 'false' : 'true');
      }
      if (on && clock.dataset.state !== 'offline') {
        clock.textContent = 'live';
        clock.dataset.state = 'updating';
      }
    }

    async function refresh() {
      if (refreshInFlight) return;
      refreshInFlight = true;
      const clock = document.getElementById('clock');
      const cold = !hasLoaded;
      const started = performance.now();
      if (cold) setColdSkeleton(true);
      else setRefreshing(true);
      try {
        const res = await fetch('/api/fleet', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'payload error');
        render(data);
        hasLoaded = true;
        document.getElementById('error').hidden = true;
        if (cold) {
          setColdSkeleton(false);
        } else {
          const elapsed = performance.now() - started;
          if (elapsed < REFRESH_HINT_MIN_MS) {
            await new Promise(r => setTimeout(r, REFRESH_HINT_MIN_MS - elapsed));
          }
          setRefreshing(false);
        }
        clock.textContent = 'live';
        clock.dataset.state = 'live';
      } catch (e) {
        document.getElementById('error').hidden = false;
        document.getElementById('error').textContent = '無法讀取狀態：' + e.message;
        if (cold) {
          // Stay on skeleton until first success.
        } else {
          setRefreshing(false);
        }
        clock.textContent = 'offline';
        clock.dataset.state = 'offline';
      } finally {
        refreshInFlight = false;
      }
    }
    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>
</html>
